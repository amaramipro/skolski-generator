                                        className="px-4 py-3 border-2 border-gray-300 rounded-xl focus:ring-4 focus:ring-indigo-200 font-semibold"
                                    />
                                </div>
                                <div className="flex items-end gap-3 flex-wrap">
                                    <button
                                        onClick={generatePlans}
                                        className={`text-white px-8 py-4 rounded-xl font-extrabold text-lg flex items-center gap-2 card-shadow-lg transition-all ${generatedPlans.length > 0 && currentCalendarVersion !== plansCalendarVersion ? 'bg-orange-600 hover:bg-orange-700' : 'btn-primary'}`}
                                    >
                                        <Icon name="clock" size={22} />
                                        {generatedPlans.length > 0 && currentCalendarVersion !== plansCalendarVersion ? '🔄 Regeneriši planove' : '🚀 Generiši planove'}
                                    </button>
                                    {generatedPlans.length > 0 && (
                                        <>
                                            <button
                                                onClick={exportToWord}
                                                className="btn-success text-white px-8 py-4 rounded-xl font-extrabold text-lg flex items-center gap-2 card-shadow-lg"
                                            >
                                                <Icon name="download" size={22} />
                                                📄 Word (lista)
                                            </button>
                                            <button
                                                onClick={exportToWordTable}
                                                className="bg-purple-600 hover:bg-purple-700 text-white px-8 py-4 rounded-xl font-extrabold text-lg flex items-center gap-2 card-shadow-lg transition-all"
                                            >
                                                <Icon name="download" size={22} />
                                                📊 Word (tabela)
                                            </button>
                                            <button
                                                onClick={resetProgress}
                                                className="bg-red-500 text-white px-6 py-4 rounded-xl font-bold flex items-center gap-2 card-shadow-lg hover:bg-red-600"
                                            >
                                                🔄 Reset
                                            </button>
                                        </>
                                    )}
                                </div>
                            </div>
                        </div> {/* KRAJ BIJELE KARTICE */}

                        {/* STATISTIKA NAPRETKA */}
                        {Object.keys(classProgressIndex).length > 0 && (
                            <div className="bg-white rounded-2xl p-6 card-shadow-xl mt-4">
                                <h3 className="font-extrabold text-lg text-gray-800 mb-4 flex items-center gap-2">
                                    📊 Statistika realizacije — {predmet}
                                </h3>
                                <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3">
                                    {svaOdjeljenja.map(key => {
                                        // classProgressIndex je uvijek per-odjeljenje (i u grupeMode)
                                        // Popis jedinica čitamo po osnovnom razredu (razred 7 za 7a i 7b)
                                        const total = (godisnjePlanove[planKey(getOsnovniRazred(key))] || []).length;
                                        const done = classProgressIndex[key] || 0;
                                        if (total === 0) return null;
                                        const pct = Math.round((done / total) * 100);
                                        const color = pct >= 80 ? 'bg-green-500' : pct >= 50 ? 'bg-amber-500' : 'bg-indigo-500';
                                        return (
                                            <div key={key} className="bg-gray-50 rounded-xl p-3 border-2 border-gray-200">
                                                <div className="font-extrabold text-center text-indigo-700 text-lg mb-1">{key.toUpperCase()}</div>
                                                <div className="w-full bg-gray-200 rounded-full h-2 mb-1">
                                                    <div className={`${color} h-2 rounded-full transition-all`} style={{width: `${Math.min(pct,100)}%`}}></div>
                                                </div>
                                                <div className="text-center text-xs font-semibold text-gray-600">{done}/{total} ({pct}%)</div>
                                            </div>
                                        );
                                    }).filter(Boolean)}
                                </div>
                            </div>
                        )}

                        {/* PRIKAZ GENERISANIH PLANOVA — NAVIGATOR */}
                        {generatedPlans.length > 0 && (
                            <WeekNavigator
                                generatedPlans={generatedPlans}
                                formatDate={formatDate}
                                editingUnit={editingUnit}
                                setEditingUnit={setEditingUnit}
                                editText={editText}
                                setEditText={setEditText}
                                updateUnit={updateUnit}
                                removeLesson={removeLesson}
                                skola={skola}
                                nastavnik={nastavnik}
                                predmet={predmet}
                            />
                        )}
                    </div>
                );
            };

            // =============================================
            // KOMPONENTA: WeekNavigator — navigator sedmica
            // =============================================
            const WeekNavigator = ({ generatedPlans, formatDate, editingUnit, setEditingUnit, editText, setEditText, updateUnit, removeLesson, skola, nastavnik, predmet }) => {
                // Pronađi tekuću sedmicu na osnovu današnjeg datuma
                const findCurrentWeek = () => {
                    const today = toLocalDateStr(new Date());
                    for (let i = 0; i < generatedPlans.length; i++) {
                        if (generatedPlans[i].weekStart <= today && today <= generatedPlans[i].weekEnd) return i;
                        if (generatedPlans[i].weekStart > today) return Math.max(0, i - 1);
                    }
                    return Math.max(0, generatedPlans.length - 1);
                };

                const [selIdx, setSelIdx] = useState(() => findCurrentWeek());
                const plan = generatedPlans[selIdx];
                const dani = ['Ponedjeljak', 'Utorak', 'Srijeda', 'Četvrtak', 'Petak'];
                const daniKratko = ['PON', 'UTO', 'SRI', 'ČET', 'PET'];

                // Je li ova sedmica tekuća
                const isCurrentWeek = (idx) => {
                    const today = toLocalDateStr(new Date());
                    const p = generatedPlans[idx];
                    return p.weekStart <= today && today <= p.weekEnd;
                };
                const isPastWeek = (idx) => {
                    const today = toLocalDateStr(new Date());
                    return generatedPlans[idx].weekEnd < today;
                };

                // Štampaj jednu sedmicu kao Word dokument (A4 landscape, tabela)
                const printWeek = (idx) => {
                    const p = generatedPlans[idx];
                    const allCas = new Set();
                    dani.forEach(d => { if (p.schedule[d]) Object.keys(p.schedule[d]).forEach(c => {
                        if (c === 'A0' || c === 'A9') allCas.add(c);
                        else if (!isNaN(parseInt(c))) allCas.add(parseInt(c));
                        else allCas.add(c);
                    }); });
                    const sortedCas = [...allCas].sort((a,b) => {
                        const toN = k => k === 'A0' ? -1 : k === 'A9' ? 99 : (typeof k === 'number' ? k : 50);
                        return toN(a) - toN(b);
                    });

                    const msWord = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>`;
                    const css = `
@page{size:29.7cm 21cm;margin:1.5cm 1.8cm}
body{font-family:'Times New Roman',serif;font-size:10pt;margin:0}
h2{font-size:12pt;margin:0 0 3pt 0;text-align:center}
.sub{font-size:9pt;color:#333;margin:0 0 8pt 0;text-align:center}
table{width:100%;border-collapse:collapse;font-size:9pt}
th{background-color:#1F3864;color:#fff;padding:5pt 4pt;text-align:center;font-weight:bold;border:1pt solid #000;font-size:9pt}
td{border:1pt solid #000;padding:4pt 5pt;vertical-align:top}
.cas-h{background-color:#374151;color:#fff;text-align:center;font-weight:bold;width:26pt;font-size:9pt}
.cas-d{background-color:#374151;color:#fff;text-align:center;font-weight:bold;font-size:9pt}
.razred{font-weight:bold;color:#1F3864;font-size:8pt;margin-bottom:2pt}
.unit{font-size:8.5pt;line-height:1.3;color:#111}
.smj{font-size:7pt;color:#777;margin-top:2pt;font-style:italic}
.prazno{color:#ccc;font-style:italic;text-align:center;font-size:8pt}
.footer{margin-top:10pt;padding-top:6pt;border-top:1pt solid #aaa;font-size:8pt}
.sig{border-bottom:1pt solid #000;min-width:150pt;display:inline-block;margin-left:8pt}`;

                    let html = `${msWord}<head><meta charset='utf-8'><style>${css}</style></head><body>`;
                    html += `<h2>SEDMIČNI PLAN RADA</h2>`;
                    html += `<p class="sub">Predmet: <b>${predmet}</b> &nbsp;&nbsp;|&nbsp;&nbsp; Nastavnik/ca: <b>${nastavnik||'_________________'}</b> &nbsp;&nbsp;|&nbsp;&nbsp; ${skola||''}</p>`;
                    html += `<p class="sub">Sedmica ${idx+1}: <b>${formatDate(p.weekStart)} – ${formatDate(p.weekEnd)}</b> &nbsp;&nbsp;|&nbsp;&nbsp; Raspored: <b>${p.raspored}</b></p>`;

                    html += `<table>`;
                    // header row
                    html += `<tr><th class="cas-h">Čas</th>`;
                    dani.forEach(d => { html += `<th>${d.toUpperCase()}</th>`; });
                    html += `</tr>`;

                    if (sortedCas.length === 0) {
                        html += `<tr><td colspan="6" class="prazno" style="padding:20pt;text-align:center">Nema časova u ovoj sedmici (praznik ili slobodni dani)</td></tr>`;
                    } else {
                        sortedCas.forEach(cas => {
                            const _isS = typeof cas === 'string' && cas.startsWith && cas.startsWith('S');
                            const _isAkt = (typeof cas === 'string') && (cas === 'A0' || cas === 'A9');
                            const _casLabel = _isAkt ? 'Aktivnost' : (typeof cas === 'number' ? cas + '.' : cas);
                            html += `<tr><td class="cas-d" ${_isAkt ? 'style="background-color:#065f46;color:#fff;text-align:center;font-weight:bold;font-size:8pt;border:1pt solid #000"' : ''}>${_casLabel}</td>`;
                            dani.forEach(d => {
                                const data = p.schedule[d]?.[String(cas)];
                                if (data) {
                                    if (data.isSekcija) {
                                        html += `<td style="background:#ecfdf5"><div class="razred" style="color:#065f46">📗 ${data.razred.toUpperCase()}</div><div class="unit" style="color:#065f46">${data.sekcijaNaziv||''}: ${data.unit||''}</div><div class="smj" style="color:#065f46">${data.vrijeme||''}</div></td>`;
                                    } else {
                                        html += `<td><div class="razred">${data.razred.toUpperCase()}</div><div class="unit">${data.unit}</div><div class="smj">Smjena ${data.smjena}</div></td>`;
                                    }
                                } else {
                                    html += `<td class="prazno">—</td>`;
                                }
                            });
                            html += `</tr>`;
                        });
                    }
                    html += `</table>`;

                    // Footer sa potpisima
                    html += `<div class="footer">`;
                    html += `<table width="100%" style="border:none"><tr>`;
                    html += `<td style="border:none;width:50%">Nastavnik/ca: <span class="sig"></span></td>`;
                    html += `<td style="border:none;text-align:right">Datum izrade: ${new Date().toLocaleDateString('bs-BA')}</td>`;
                    html += `</tr></table>`;
                    html += `</div>`;
                    html += `</body></html>`;

                    downloadDoc(html, `SedmicniPlan_Sedmica${idx+1}_${p.weekStart}.doc`, 'Sedmični');
                };

                return (
                    <div className="space-y-4">
                        {/* Header navigatora */}
                        <div className="bg-white rounded-2xl p-5 card-shadow-xl">
                            <div className="flex items-center justify-between mb-4 flex-wrap gap-3">
                                <h3 className="font-extrabold text-xl text-gray-800 flex items-center gap-2">
                                    📅 Sedmični planovi
                                    <span className="text-sm font-normal text-gray-500 bg-gray-100 px-3 py-1 rounded-full">
                                        {generatedPlans.length} sedmica
                                    </span>
                                </h3>
                                <div className="flex gap-2 flex-wrap">
                                    <button
                                        onClick={() => setSelIdx(findCurrentWeek())}
                                        className="bg-blue-600 text-white px-4 py-2 rounded-xl font-bold text-sm hover:bg-blue-700 flex items-center gap-1"
                                    >
                                        📍 Ova sedmica
                                    </button>
                                    <button
                                        onClick={() => setSelIdx(Math.min(generatedPlans.length - 1, findCurrentWeek() + 1))}
                                        className="bg-indigo-600 text-white px-4 py-2 rounded-xl font-bold text-sm hover:bg-indigo-700 flex items-center gap-1"
                                    >
                                        ⏭️ Naredna sedmica
                                    </button>
                                </div>
                            </div>

                            {/* Traka svih sedmica — kliktabilne kapsule */}
                            <div className="flex gap-1.5 flex-wrap mb-1">
                                {generatedPlans.map((p, i) => {
                                    const isCur = isCurrentWeek(i);
                                    const isPast = isPastWeek(i);
                                    const isSel = i === selIdx;
                                    return (
                                        <button key={i} onClick={() => setSelIdx(i)}
                                            className={`px-2.5 py-1 rounded-lg text-xs font-bold transition-all border-2 ${
                                                isSel
                                                    ? 'bg-indigo-700 text-white border-indigo-700 shadow-lg scale-105'
                                                    : isCur
                                                    ? 'bg-blue-100 text-blue-800 border-blue-400 font-extrabold'
                                                    : isPast
                                                    ? 'bg-gray-100 text-gray-400 border-gray-200'
                                                    : 'bg-white text-gray-600 border-gray-300 hover:border-indigo-400 hover:text-indigo-700'
                                            }`}
                                            title={`${p.weekStart} – ${p.weekEnd}`}
                                        >
                                            {isCur ? '📍' : ''}{i+1}
                                        </button>
                                    );
                                })}
                            </div>
                            <div className="text-xs text-gray-400 mt-1 flex gap-4">
                                <span>📍 tekuća &nbsp; <span className="bg-indigo-700 text-white px-1.5 rounded">■</span> odabrana &nbsp; <span className="text-gray-400">sivE</span> = prošle</span>
                            </div>
                        </div>

                        {/* Odabrana sedmica — NAVIGATOR + PRIKAZ */}
                        {plan && (
                            <div className={`rounded-2xl card-shadow-xl border-4 overflow-hidden ${isCurrentWeek(selIdx) ? 'border-blue-500' : 'border-indigo-200'}`}>
                                {/* Traka naslova sedmice */}
                                <div className={`px-6 py-4 flex items-center justify-between gap-3 flex-wrap ${isCurrentWeek(selIdx) ? 'bg-blue-600' : 'bg-indigo-700'}`}>
                                    <button onClick={() => setSelIdx(Math.max(0, selIdx-1))} disabled={selIdx===0}
                                        className="text-white font-extrabold text-xl px-3 py-1 rounded-lg hover:bg-white hover:bg-opacity-20 disabled:opacity-30 disabled:cursor-not-allowed">
                                        ◀
                                    </button>
                                    <div className="text-white text-center">
                                        <div className="font-extrabold text-lg">
                                            {isCurrentWeek(selIdx) && <span className="bg-yellow-400 text-yellow-900 text-xs font-extrabold px-2 py-0.5 rounded-full mr-2">TEKUĆA</span>}
                                            Sedmica {selIdx+1} / {generatedPlans.length}
                                        </div>
                                        <div className="text-blue-100 text-sm font-semibold">
                                            {formatDate(plan.weekStart)} – {formatDate(plan.weekEnd)}
                                            &nbsp;|&nbsp; Raspored <strong className="text-white">{plan.raspored}</strong>
                                        </div>
                                    </div>
                                    <button onClick={() => setSelIdx(Math.min(generatedPlans.length-1, selIdx+1))} disabled={selIdx===generatedPlans.length-1}
                                        className="text-white font-extrabold text-xl px-3 py-1 rounded-lg hover:bg-white hover:bg-opacity-20 disabled:opacity-30 disabled:cursor-not-allowed">
                                        ▶
                                    </button>
                                </div>

                                {/* Tijelo sedmice */}
                                <div className="bg-white p-5">
                                    {/* Uputa za uređivanje */}
                                    <div className="bg-amber-50 border border-amber-200 rounded-lg px-4 py-2 mb-4 text-xs text-amber-800 flex flex-wrap gap-3">
                                        <span>✏️ <strong>Izmjena:</strong> klik na nastavnu jedinicu</span>
                                        <span>🗑️ <strong>Ukloni čas:</strong> pomjera se u narednu sedmicu</span>
                                        <span>⌨️ <strong>Promijenjena jedinica</strong> ostaje samo u ovoj sedmici</span>
                                    </div>

                                    {/* Raspored dana */}
                                    <div className="grid grid-cols-5 gap-2">
                                        {dani.map((dan, di) => (
                                            <div key={dan}>
                                                <div className="font-extrabold text-xs text-center text-gray-700 uppercase bg-gray-100 rounded-lg px-1 py-2 mb-2 tracking-wide">
                                                    {daniKratko[di]}<br/>
                                                    <span className="text-gray-400 font-normal normal-case text-xs">{dan.slice(0,3)}</span>
                                                </div>
                                                {plan.schedule[dan] && Object.keys(plan.schedule[dan]).length > 0 ? (
                                                    <div className="space-y-1.5">
                                                        {Object.entries(plan.schedule[dan]).sort(([a],[b]) => {
                                                            const toNum = k => k === 'A0' ? -1 : k === 'A9' ? 99 : (parseInt(k) || 50);
                                                            return toNum(a) - toNum(b);
                                                        }).map(([cas, data]) => (
                                                            <div key={cas} className={`${data.isSekcija ? 'bg-emerald-50 border-2 border-emerald-300' : 'bg-gray-50 border border-gray-200'} rounded-xl p-2.5 text-xs hover:shadow-md transition-shadow group`}>
                                                                <div className="flex items-center justify-between mb-1">
                                                                    <span className={`font-extrabold text-sm ${data.isSekcija?'text-emerald-700':'text-indigo-700'}`}>{data.isSekcija ? '📗 Aktivnost' : cas+'. čas'}</span>
                                                                    <span className="text-gray-400 text-xs">{data.isSekcija ? (data.vrijeme || '') : 'sm'+data.smjena}</span>
                                                                </div>
                                                                <div className="flex items-center justify-between mb-1.5">
                                                                    <span className="font-bold text-blue-800 text-xs">{data.isSekcija ? (data.sekcijaNaziv||data.razred) : data.razred.toUpperCase()}</span>
                                                                    {data.unitIndex !== undefined && (() => {
                                                                        const totalUnits = (godisnjePlanove[planKey(getOsnovniRazred(data.razred))]||[]).length;
                                                                        return <span className="unit-ordinal-badge">#{data.unitIndex + 1}/{totalUnits}</span>;
                                                                    })()}
                                                                </div>
                                                                {editingUnit?.weekIndex === selIdx && editingUnit?.dan === dan && editingUnit?.cas === cas ? (
                                                                    <div className="space-y-1.5">
                                                                        <textarea value={editText} onChange={e=>setEditText(e.target.value)}
                                                                            className="w-full p-1.5 border-2 border-amber-300 rounded text-xs" rows="3" autoFocus />
                                                                        <div className="flex gap-1">
                                                                            <button onClick={()=>updateUnit(selIdx,dan,cas)} className="flex-1 bg-green-500 text-white py-1 rounded text-xs font-bold">✓</button>
                                                                            <button onClick={()=>setEditingUnit(null)} className="flex-1 bg-gray-300 py-1 rounded text-xs font-bold">✗</button>
                                                                        </div>
                                                                    </div>
                                                                ) : (
                                                                    <div>
                                                                        <div className="text-gray-800 leading-tight text-xs mb-2" title={data.unit}>{data.unit}</div>
                                                                        <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                                                            <button onClick={()=>{setEditingUnit({weekIndex:selIdx,dan,cas});setEditText(data.unit);}}
                                                                                className="flex-1 bg-amber-500 text-white py-0.5 rounded text-xs font-bold hover:bg-amber-600" title="Izmijeni">✏️</button>
                                                                            <button onClick={()=>removeLesson(selIdx,dan,cas)}
                                                                                className="flex-1 bg-red-500 text-white py-0.5 rounded text-xs font-bold hover:bg-red-600" title="Ukloni čas (pomjera u narednu sedmicu)">🗑️</button>
                                                                        </div>
                                                                    </div>
                                                                )}
                                                            </div>
                                                        ))}
                                                    </div>
                                                ) : (() => {
                                                    // Provjeri je li ovaj dan bio neradni
                                                    const dayDate = new Date(parseLocalDate(plan.weekStart).getTime() + di * 864e5);
                                                    const dayStr = toLocalDateStr(dayDate);
                                                    const isHoliday = neradniDani.includes(dayStr) || dayDate.getDay() === 0 || dayDate.getDay() === 6;
                                                    
                                                    // Provjeri ima li ikakvih časova u rasporedu za ovaj dan
                                                    // (neovisno o tome je li neradni - možda dan nije bio u rasporedu)
                                                    const activeRasporedForDay = (() => {
                                                        for (const period of rasporedPeriodi) {
                                                            const ps = parseLocalDate(period.start), pe = parseLocalDate(period.end);
                                                            if (dayDate >= ps && dayDate <= pe)
                                                                return period.raspored === 'A' ? rasporedA : rasporedB;
                                                        }
                                                        return rasporedA;
                                                    })();
                                                    const dayScheduled = Object.keys(activeRasporedForDay[dan] || {}).length > 0;
                                                    
                                                    if (isHoliday && dayScheduled) {
                                                        // Dan je bio neradni, a u rasporedu ima časova koji su trebali biti
                                                        return (
                                                            <div className="border-2 border-dashed border-red-300 rounded-xl p-3 text-center bg-red-50">
                                                                <div className="text-red-500 text-sm font-bold">🔴</div>
                                                                <div className="text-red-600 text-xs font-semibold">Neradni dan</div>
                                                                <div className="text-red-400 text-xs mt-0.5">Časovi preneseni</div>
                                                            </div>
                                                        );
                                                    } else {
                                                        return (
                                                            <div className="border-2 border-dashed border-gray-200 rounded-xl p-3 text-center text-gray-300 text-xs italic">
                                                                Nema<br/>časova
                                                            </div>
                                                        );
                                                    }
                                                })()}
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Donji toolbar */}
                                <div className="bg-gray-50 border-t border-gray-200 px-5 py-3 flex flex-wrap gap-3 justify-between items-center">
                                    <div className="text-sm text-gray-500 font-semibold">
                                        {selIdx < generatedPlans.length - 1 && (
                                            <span>
                                                Naredna sedmica: <strong className="text-gray-700">{formatDate(generatedPlans[selIdx+1].weekStart)} – {formatDate(generatedPlans[selIdx+1].weekEnd)}</strong>
                                            </span>
                                        )}
                                    </div>
                                    <div className="flex gap-2 flex-wrap">
                                        <button onClick={() => printWeek(selIdx)}
                                            className="bg-green-600 hover:bg-green-700 text-white px-5 py-2.5 rounded-xl font-extrabold text-sm flex items-center gap-2 shadow-lg">
                                            <Icon name="download" size={18}/> 🖨️ Štampaj ovu sedmicu
                                        </button>
                                        {selIdx < generatedPlans.length - 1 && (
                                            <button onClick={() => printWeek(selIdx + 1)}
                                                className="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl font-bold text-sm flex items-center gap-2 shadow-lg">
                                                <Icon name="download" size={18}/> 🖨️ Štampaj narednu ({selIdx+2}.)
                                            </button>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };


            // =============================================
            // KOMPONENTA: PodaciTab — Import/Export + BiH Praznici
            // =============================================
            const PodaciTab = () => {
                const yr1 = parseInt(skolskaGodinaGlobal);
                const yr2 = parseInt(skolskaGodina2);

                // ── Editabilni praznik ──
                const [editId, setEditId] = useState(null);
                const [editNaziv, setEditNaziv] = useState('');
                const [editDatum, setEditDatum] = useState('');
                const [newNaziv, setNewNaziv] = useState('');
                const [newDatum, setNewDatum] = useState('');
                const [showAdd, setShowAdd] = useState(false);

                const toggleAktivan = (id) => {
                    setBihPraznici(prev => prev.map(p => p.id === id ? {...p, aktivan: !p.aktivan} : p));
                };
                const startEdit = (p) => { setEditId(p.id); setEditNaziv(p.naziv); setEditDatum(p.datum); };
                const saveEdit = () => {
                    setBihPraznici(prev => prev.map(p => p.id === editId ? {...p, naziv: editNaziv, datum: editDatum} : p));
                    setEditId(null);

                    // === STRANA 2 - I polugodište ===

                    downloadDoc(html, `Godisnji_plan_${predmet}_${exportRazred}razred.doc`, 'Godišnji');
                };

                // ── Pregled raspodjele po mjesecu (preview) ──
                // Isto kao exportGodisnji: MAX aktivnih sedmica svih odjeljenja razreda
                const previewOdjeljenja = svaOdjeljenja.filter(o => o.startsWith(exportRazred));
                const pol1Preview = ['Septembar','Oktobar','Novembar','Decembar'];
                const pol2Preview = ['Februar','Mart','April','Maj','Juni'];
                const allRadniPreview = [...pol1Preview, ...pol2Preview];
                const previewWksCount = {};
                allRadniPreview.forEach(m => {
                    const monthInfo = SKOLSKI_MJESECI.find(sm => sm.n === m);
                    let maxW = 0;
                    if (monthInfo) {
                        const yr = monthInfo.i >= 8 ? parseInt(skolskaGodinaGlobal) : parseInt(skolskaGodina2);
                        previewOdjeljenja.forEach(odj => {
                            const w = getActiveWeeksGlobal(monthInfo.i, yr, odj).length;
                            if (w > maxW) maxW = w;

                    }
                    previewWksCount[m] = maxW;
                });
                const totalWksPreview = allRadniPreview.reduce((s, m) => s + previewWksCount[m], 0);
                const hasSchedule = totalWksPreview > 0;

                // Izračunaj koliko jedinica bi dobio svaki mjesec
                let previewIdx = 0;
                const previewUnits = godisnjePlanove[planKey(exportRazred)] || [];
                const previewMap = {};
                if (hasSchedule) {

                    allRadniPreview.forEach(m => {

                        previewIdx = Math.min(previewIdx + perM, previewUnits.length);

                }
                const polPrevBg = { 'Septembar':'#EEF2FF','Oktobar':'#EEF2FF','Novembar':'#EEF2FF','Decembar':'#EEF2FF',
                                    'Februar':'#F0FDF4','Mart':'#F0FDF4','April':'#F0FDF4','Maj':'#F0FDF4','Juni':'#F0FDF4' };

                return (
                    <div className="space-y-6 animate-fade-in">

                            <p className="text-green-700">3 stranice: naslovna + I polugodište + II polugodište. Januar automatski prazan. Za svaki mjesec gleda sva odjeljenja razreda i planira prema onom koje ima <strong>najviše časova</strong> — tako godišnji plan pokriva i najopterećenije odjeljenje.</p>
                        </div>

                                        {osnovniRazredi.map(r=><option key={r} value={r}>{r}. razred ({(godisnjePlanove[planKey(r)]||[]).length} jed.)</option>)}
                                    </select>

                                <div className="flex items-end">

                                        <Icon name="download" size={22}/> 📥 Preuzmi Godišnji plan
                                    </button>
                                </div>
                            </div>

                            {/* ── PREVIEW RASPODJELE PO KALENDARSKIM SEDMICAMA ── */}
                            {previewUnits.length > 0 && (
                                <div>

                                        </div>

                                            </span>

                                        {hasSchedule && (

                                                <div className={`text-xs font-extrabold mb-2 ${pi===0?'text-indigo-800':'text-emerald-800'}`}>{pol}</div>
                                                {(pi===0 ? pol1Preview : pol2Preview).map(m => {
                                                    const pm = previewMap[m];
                                                    const hasUnits = pm && pm.from <= previewUnits.length;
                                                    return (
                                                        <div key={m} className="flex items-center justify-between py-0.5 border-b border-white border-opacity-60 last:border-0">

                                    {previewUnits.length > totalWksPreview && hasSchedule && (

                                        </div>
                                    )}
                                    {previewUnits.length < totalWksPreview && hasSchedule && (
                                        <div className="mt-2 bg-blue-50 border border-blue-200 rounded-lg px-3 py-2 text-xs text-blue-800">
                                            ℹ️ Ima <strong>{totalWksPreview - previewUnits.length} slobodnih sedmica</strong> bez nastavne jedinice. Razmotriti dodavanje više jedinica.
                                        </div>
                                    )}
                                </div>
                            )}

                            <div>
                                <div className="text-sm font-bold text-gray-600 mb-2">📚 Nastavne jedinice — {exportRazred}. razred ({previewUnits.length})</div>
                                <div className="max-h-52 overflow-y-auto border border-gray-200 rounded-xl p-3 bg-gray-50">
                                    {previewUnits.length === 0
                                        ? <p className="text-gray-400 text-center py-4 text-sm">Nema jedinica. Unesite ih u tab "Godišnji plan".</p>
                                        : previewUnits.map((u,i)=>(
                                            <div key={i} className="flex gap-2 py-1 border-b border-gray-100 text-sm">
                                                <span className="font-bold text-indigo-600 w-7 flex-shrink-0">{i+1}.</span>
                                                <span className="text-gray-700">{u}</span>

                    </div>
                );
            };

            // =============================================
            // KOMPONENTA: Eksport Mjesečnog plana (16-B-1)
            // =============================================
            const MjesecniExport = () => {
                const allM = [
                    {n:'Septembar',i:8},{n:'Oktobar',i:9},{n:'Novembar',i:10},{n:'Decembar',i:11},
                    {n:'Januar',i:0},{n:'Februar',i:1},{n:'Mart',i:2},{n:'April',i:3},{n:'Maj',i:4},{n:'Juni',i:5}
                ];
                const radniM = ['Septembar','Oktobar','Novembar','Decembar','Februar','Mart','April','Maj','Juni'];
                const [expRazred, setExpRazred] = useState(osnovniRazredi[0]||'6');
                const [expOdj, setExpOdj] = useState(() => {
                    const r = osnovniRazredi[0]||'6';
                    return svaOdjeljenja.filter(o=>o.startsWith(r))[0] || r+'a';
                });
                const [expMjesec, setExpMjesec] = useState(8);
                const [aiLoading, setAiLoading] = useState(false);
                const [aiStatus, setAiStatus] = useState('');

                const handleRazredChange = (r) => {
                    setExpRazred(r);
                    setExpOdj(svaOdjeljenja.filter(o=>o.startsWith(r))[0] || r+'a');
                };

                // ── A4 tačne mjere iz originala (0.79in L/R, 0.98in T/B) ──
                const pageCSS = `
@page {
    size: 8.27in 11.69in;
    margin-left: 0.79in; margin-right: 0.79in;
    margin-top: 0.98in; margin-bottom: 0.98in;
}
body {
    font-family: 'Times New Roman', serif;
    font-size: 10pt;
    margin: 0; padding: 0;
    color: #000000;
    line-height: 115%;
    orphans: 2; widows: 2;
}
p {
    margin: 0; padding: 0;
    line-height: 100%;
    color: #000000;
    font-family: 'Times New Roman', serif;
    font-size: 10pt;
    direction: ltr;
}
td { font-family: 'Times New Roman', serif; font-size: 10pt; color: #000000; }
table { border-collapse: collapse; }
`;
                // MSO Word headers — mso-element sa tačnim page setup direktivama
                const wsHdr = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'>" +
                    "<!--[if gte mso 9]><xml>" +
                    "<w:WordDocument><w:View>Print</w:View>" +
                    "<w:Zoom>100</w:Zoom>" +
                    "<w:DoNotOptimizeForBrowser/>" +
                    "<w:Compatibility><w:BreakWrappedTables/><w:SnapToGridInCell/><w:WrapTextWithPunct/><w:UseAsianBreakRules/></w:Compatibility>" +
                    "</w:WordDocument></xml>" +
                    "<o:OfficeDocumentSettings><o:AllowPNG/></o:OfficeDocumentSettings>" +
                    "<![endif]-->" +
                    "<style>" + pageCSS + "</style></head><body lang='hr-HR' text='#000000' dir='ltr'>";

                const zagM = () => {
                    const g1=skolskaGodinaGlobal.toString().slice(2), g2=skolskaGodina2.toString().slice(2);
                    return `<table width="100%" style="border:none;border-collapse:collapse"><tr>`+
                    `<td style="border:none;vertical-align:top;width:55%"><p style="margin-bottom:0"><font face="Times New Roman" style="font-size:12pt"><b>${skola}</b></font></p><p style="margin-bottom:0;font-size:8pt">(Naziv škole)</p><p><br/></p><p style="margin-bottom:0"><font face="Times New Roman" style="font-size:12pt"><b>${mjesto||'___________'}</b></font></p><p style="margin-bottom:0;font-size:8pt">(Mjesto)</p></td>`+
                    `<td style="border:none;vertical-align:top;text-align:right;width:45%"><p style="text-align:right;font-size:10pt">(Strana 1)</p><p style="text-align:right;font-size:10pt">(Obrazac broj 16-B-1)</p><p><br/></p><p style="text-align:right"><font face="Times New Roman" style="font-size:12pt"><b>Školska 20${g1}/20${g2}. godina</b></font></p></td>`+
                    `</tr></table>`;
                };

                const cleanU = (u) => u.replace(/^\s*\d+[.)]\s*/,'').trim();

                const fmt = (d) => `${d.getDate()}.${d.getMonth()+1}.${d.getFullYear()}`;

                // Aliasi na globalne helper funkcije (definirane u parent scopeu)
                const getRasporedForWeek = getRasporedForWeekGlobal;
                const getWeeksForMonth = getWeeksForMonthGlobal;
                const getActiveWeeks = getActiveWeeksGlobal;
                const DANI = DANI_TJEDAN;

                // Redni broj prve jedinice za ovaj mesec (offset svih aktivnih sedmica u prethodnim radnim mesecima)
                const getUnitOffset = (odjeljenje, monthName) => {
                    let offset = 0;
                    for (const m of radniM) {
                        if (m === monthName) break;
                        const mInfo = allM.find(x => x.n === m);
                        if (!mInfo) continue;
                        const yr = mInfo.i >= 8 ? parseInt(skolskaGodinaGlobal) : parseInt(skolskaGodina2);
                        offset += getActiveWeeks(mInfo.i, yr, odjeljenje).length;
                    }
                    return offset;
                };

                // Kumulativni broj časova prije ovog mjeseca (za redni broj časa)
                const getCasovaOffset = (odjeljenje, monthName) => {
                    let total = 0;
                    for (const m of radniM) {
                        if (m === monthName) break;
                        const mInfo = allM.find(x => x.n === m);
                        if (!mInfo) continue;
                        const yr = mInfo.i >= 8 ? parseInt(skolskaGodinaGlobal) : parseInt(skolskaGodina2);
                        getActiveWeeks(mInfo.i, yr, odjeljenje).forEach(w => { total += w.casova; });
                    }
                    return total;
                };

                const buildPage = (mo, odjeljenje, aiAllUnits) => {
                    const g1 = skolskaGodinaGlobal.toString().slice(2);
                    const g2 = skolskaGodina2.toString().slice(2);
                    const units = (godisnjePlanove[planKey(getOsnovniRazred(odjeljenje))]||[]).map(cleanU);

                    const yr = mo.i >= 8 ? parseInt(skolskaGodinaGlobal) : parseInt(skolskaGodina2);
                    const activeWks = getActiveWeeks(mo.i, yr, odjeljenje);
                    const unitOffset = getUnitOffset(odjeljenje, mo.n);
                    const casovaOffset = getCasovaOffset(odjeljenje, mo.n);

                    // ─── VISINE: tabela uvijek puni cijelu A4 stranicu ────────
                    // A4 korisna visina pri 0.98in gornja/donja margina:
                    //   841.89pt - 2 × 70.56pt = 700.77pt → koristimo 698pt
                    //
                    // Fiksni elementi (izmjereno piksel-po-piksel iz originala):
                    //   Zaglavlje (škola + mjesto + godina) = 62pt
                    //   Para spacer                         =  6pt
                    //   Naslov MIESEČNI PLAN RADA (14pt)    = 18pt + 8pt margin = 26pt
                    //   Red predmet/razred/mjesec (10pt)    = 14pt + 4pt margin = 18pt
                    //   Gap ispod tog reda                  =  4pt
                    //   Header tabele                       = 46pt  ← mjereno
                    //   Spacer ispod tabele                 =  6pt
                    //   Potpisi tabela                      = 32pt
                    //   Ukupno fiksno:                      ≈ 214pt
                    //
                    // Dostupno za data-redove: 698 - 214 = 484pt
                    // Minimum po redu: 60pt da tekst stane

                    const PAGE_H      = 698;   // pt, A4 minus margine
                    const FIXED_H     = 258;   // pt, sve osim data redova (povećano za sigurnost)
                    const HDR_H       = 46;    // pt, visina header reda tabele
                    const FOOTER_H    = 44;    // pt, spacer + potpisi
                    const AVAIL_DATA  = PAGE_H - FIXED_H;  // = 440pt
                    const n           = activeWks.length || 1;
                    const rowH        = Math.max(56, Math.floor(AVAIL_DATA / n));

                    // Ukupna visina tabele u pt (za Word's mso-height)
                    const tableH = HDR_H + rowH * n;

                    const sedOrd = ['Prva','Druga','Treća','Četvrta','Peta','Šesta'];

                    // ─── BORDOVI (identično originalu) ────────────────────────
                    const outerL = '1.50pt solid #000000';
                    const outerR = '1.50pt solid #000000';
                    const outerT = '1.50pt solid #000000';
                    const outerB = '1.50pt solid #000000';
                    const inner  = '1px solid #000000';

                    // ─── REDOVI TABELE ────────────────────────────────────────
                    let rows = '';
                    if (activeWks.length === 0) {
                        rows = `<tr height="${rowH}" style="height:${rowH}pt;mso-height-rule:exactly">
                            <td colspan="6"
                                style="border-top:${inner};border-bottom:${outerB};border-left:${outerL};border-right:${outerR};
                                       padding:6pt 8pt;font-size:10pt;font-style:italic;text-align:center;vertical-align:middle">
                                Nema školskih dana u ovom mjesecu (praznik/raspust)
                            </td>
                        </tr>`;
                    } else {
                        activeWks.forEach((wk, i) => {
                            const isLast = i === activeWks.length - 1;
                            const uIdx   = unitOffset + i;
                            const u      = units[uIdx] || '';
                            const ai     = aiAllUnits?.[uIdx] || { tema:'', ciljevi:'', ishodi:'' };

                            // Redni broj nastavne jedinice u godišnjem planu
                            // unitOffset = koliko jedinica je bilo u prethodnim mjesecima
                            // i = index sedmice unutar ovog mjeseca (0-based)
                            // +1 jer prikazujemo 1-based
                            const redniBr = `${unitOffset + i + 1}.`;

                            const bT = inner;
                            const bB = isLast ? outerB : inner;

                            const tdBase  = (extra='') =>
                                `border-top:${bT};border-bottom:${bB};border-left:${inner};border-right:${inner};` +
                                `padding:3pt 5pt;font-size:10pt;vertical-align:top;${extra}`;
                            const tdFirst =
                                `border-top:${bT};border-bottom:${bB};border-left:${outerL};border-right:${inner};` +
                                `padding:3pt 5pt;font-size:10pt;vertical-align:middle;text-align:center;`;
                            const tdCas =
                                `border-top:${bT};border-bottom:${bB};border-left:${inner};border-right:${inner};` +
                                `padding:3pt 4pt;font-size:10pt;vertical-align:middle;text-align:center;font-weight:bold;`;
                            const tdLast =
                                `border-top:${bT};border-bottom:${bB};border-left:${inner};border-right:${outerR};` +
                                `padding:3pt 5pt;font-size:10pt;vertical-align:top;`;

                            // mso-height-rule:exactly — Word koristi TAČNO tu visinu
                            rows += `<tr height="${rowH}" style="height:${rowH}pt;mso-height-rule:exactly">
                                <td style="${tdFirst}">
                                    <p style="margin:0;font-size:10pt;font-weight:bold;line-height:130%">${sedOrd[i]||((i+1)+'.')} sedmica</p>
                                    <p style="margin:0;font-size:9pt;line-height:130%">od ${fmt(wk.mon)}</p>
                                    <p style="margin:0;font-size:9pt;line-height:130%">do ${fmt(wk.fri)}</p>
                                </td>
                                <td style="${tdCas}">${redniBr}</td>
                                <td style="${tdBase()}">${ai.tema||''}</td>
                                <td style="${tdBase()}">${u}</td>
                                <td style="${tdBase()}">${ai.ciljevi||''}</td>
                                <td style="${tdLast}">${ai.ishodi||''}</td>
                            </tr>`;
                        });
                    }

                    // ─── CIJELI DOKUMENT ──────────────────────────────────────
                    return `
<table width="100%" cellpadding="0" cellspacing="0" style="border:none">
<tr>

                          + wTc(wP(cut(p.kognitivni,420), {sz:17, after:0}), {w:C2})
                          + wTc(wP(cut(p.afektivni,340), {sz:17, after:0}), {w:C3})
                          + wTc(wP(cut(p.psihomotoricki,340), {sz:17, after:0}), {w:C4}), hR)).join('')
                      : wTr(wTc('', {w:C1}) + wTc('', {w:C2}) + wTc('', {w:C3}) + wTc('', {w:C4}), 7279);

                    const t3 = wTbl(
                        wTr(wTc(wP('INDIVIDUALNI PROGRAM IZ PREDMETA: ' + String(predmet||'').toUpperCase()
                                   + '   —   PERIOD: ' + String(period||'').toUpperCase(),
                                   {align:'center', b:true, sz:20, after:0}),
                                {w:C1+C2+C3+C4, span:4, shade:SIVA}), 420)
                      + wTr(wTc(wP('PROGRAMSKI SADRŽAJI TEMATSKE CJELINE KOJI SE PRILAGOĐAVAJU',
                                   {align:'center', b:true, sz:17, after:0}),
                                {w:C1, vmerge:'restart', shade:SIVA, valign:'center'})
                          + wTc(wP('NASTAVNI CILJEVI I ZADACI', {align:'center', b:true, sz:18, after:0}),
                                {w:C2+C3+C4, span:3, shade:SIVA}), 400)
                      + wTr(wTc('', {w:C1, vmerge:''})
                          + wTc(wP('KOGNITIVNI', {align:'center', b:true, sz:17, after:0})
                              + wP('(OBRAZOVNI)', {align:'center', sz:15, after:0}), {w:C2, shade:SIVA})
                          + wTc(wP('AFEKTIVNI', {align:'center', b:true, sz:17, after:0})
                              + wP('(ODGOJNI)', {align:'center', sz:15, after:0}), {w:C3, shade:SIVA})
                          + wTc(wP('PSIHOMOTORIČKI', {align:'center', b:true, sz:17, after:0})
                              + wP('(FUNKCIONALNI)', {align:'center', sz:15, after:0}), {w:C4, shade:SIVA}), 460)
                      + planRedovi
                      + wTr(wTc(wP('Napomena:', {b:true, sz:18, after:0}), {w:C1+C2+C3+C4, span:4}), 760),
                        [C1, C2, C3, C4]);

                    const s3 = wP('(strana 3.)', {align:'right', sz:19, after:160}) + t3;

                    // ── Strana 4: proprocesni sadržaji + potpisi ──────────
                    const A1 = 4372, A2 = 4372, A3 = 5828;
                    const t4 = wTbl(
                        wTr(wTc(wP('PROPROCESNI SADRŽAJI - NIVO PODRŠKE', {align:'center', b:true, sz:18, after:0})
                              + wP('(izbor nastavnih oblika, metoda, sredstava i pomagala)', {align:'center', sz:15, after:0}),
                                {w:A1+A2, span:2, shade:SIVA})
                          + wTc(wP('IZVJEŠTAJ O OSTVARENOSTI ISHODA UČENJA', {align:'center', b:true, sz:18, after:0})
                              + wP('(Formativno praćenje i vrednovanje)', {align:'center', sz:15, after:0}),
                                {w:A3, vmerge:'restart', shade:SIVA, valign:'center'}), 520)
                      + wTr(wTc(wP('AKTIVNOSTI NASTAVNIKA', {align:'center', b:true, sz:17, after:0}), {w:A1, shade:SIVA})
                          + wTc(wP('AKTIVNOSTI UČENIKA', {align:'center', b:true, sz:17, after:0}), {w:A2, shade:SIVA})
                          + wTc('', {w:A3, vmerge:''}), 400)
                      + wTr(wTc(wP(cut(result.aktivnostiNastavnika,900), {sz:17, after:0}), {w:A1})
                          + wTc(wP(cut(result.aktivnostiUcenika,900), {sz:17, after:0}), {w:A2})
                          + wTc(wP(saIshodima ? cut(result.ostvarenostIshoda,1100) : '', {sz:17, after:0}), {w:A3}), 5900)
                      + wTr(wTc(wP('Napomena:', {b:true, sz:18, after:0}), {w:A1+A2+A3, span:3}), 760),
                        [A1, A2, A3]);

                    const potpisi = wTblPlain(
                        wTr(wTc(wP('Program realizovao: ______________________________', {sz:20, after:0}), {w:8744})
                          + wTc(wP('Direktor/ica', {align:'center', sz:20, after:0}), {w:5828}), 420)
                      + wTr(wTc(wP('Nastavnik: ______________________________________', {sz:20, before:240, after:0}), {w:8744})
                          + wTc(wP('M.P.        ____________________', {align:'center', sz:20, before:240, after:0}), {w:5828}), 460),
                        [8744, 5828]);

                    const s4 = wP('(strana 4 – na poleđini strane 3)', {align:'right', sz:19, after:140})
                             + t4
                             + wP('', {sz:16, after:260})
                             + potpisi;

                    const blob = buildDocx([
                        { orient:'portrait',  body:s1 },
                        { orient:'portrait',  body:s2 },
                        { orient:'landscape', body:s3 },
                        { orient:'landscape', body:s4 },
                    ]);
                    window.__addToLib(blob,
                        asciiIme('Obrazac15A_' + (saIshodima ? 'REALIZACIJA' : 'PLAN') + '_'
                        + (u.ime||'ucenik') + '_' + String(period||'')) + '.docx',
                        'Prilagođeni');
                    // Realizacije se arhiviraju — iz njih se sastavlja polugodišnji izvještaj
                    if (saIshodima) {
                        try {
                            const arh = JSON.parse(localStorage.getItem('pop_realizacije') || '{}');
                            const kljucU = (u.ime || 'ucenik') + '|' + predmet;
                            if (!arh[kljucU]) arh[kljucU] = {};
                            arh[kljucU][period] = {
                                period,
                                mjeseci: [...selMjeseci],
                                ostvarenost: result.ostvarenostIshoda || '',
                                teme: (plan || []).map(p => String(p.sadrzaji || '').split('\n')[0]).filter(Boolean),
                                aktivnostiUcenika: result.aktivnostiUcenika || '',
                                datum: new Date().toLocaleDateString('bs-BA'),
                            };
                            localStorage.setItem('pop_realizacije', JSON.stringify(arh));
                        } catch(_) {}
                    }
                    showToast(saIshodima
                        ? '✅ Obrazac s ostvarenošću — sačuvan i za polugodišnji izvještaj.'
                        : '✅ Obrazac (plan) — rubrika ostvarenosti je prazna, predaje se na početku.');
                    } catch(err) { showToast('❌ Greška: '+err.message,'error'); }
                };

                // ══════════════════════════════════════════════════════════
                // OBRAZAC 3: POLUGODIŠNJI IZVJEŠTAJ
                // Rekapitulacija SVIH realizacija (Obrazac 15-A) u polugodištu.
                // I polugodište: IX–XII (predaje se u januaru)
                // II polugodište: II–VI (predaje se u junu)
                // ══════════════════════════════════════════════════════════
                const POLUGODISTA = {
                    I:  { naziv: 'I polugodište',  mj: ['sep','okt','nov','dec'],       opis: 'septembar – decembar' },
                    II: { naziv: 'II polugodište', mj: ['feb','mar','apr','maj','jun'], opis: 'februar – juni' },
                };

                // Sve arhivirane realizacije za učenika u datom polugodištu
                const realizacijeZa = (imeUcenika, pg) => {
                    let arh = {};
                    try { arh = JSON.parse(localStorage.getItem('pop_realizacije') || '{}'); } catch(_) {}
                    const zapisi = arh[(imeUcenika || '') + '|' + predmet] || {};
                    const dozvoljeni = POLUGODISTA[pg].mj;
                    return Object.values(zapisi)
                        .filter(z => (z.mjeseci || []).some(m => dozvoljeni.includes(m)))
                        .sort((a, b) => {
                            const red = ['sep','okt','nov','dec','jan','feb','mar','apr','maj','jun'];
                            return red.indexOf((a.mjeseci||[])[0]) - red.indexOf((b.mjeseci||[])[0]);
                        });
                };

                const exportIzvjestaj = (pg = 'I') => {
                    const u = result?.ucenik || {};
                    const ime = u.ime || (selU ? (ucenici.find(x => x.id === selU)?.ime) : '') || '';
                    if (!ime) { showToast('⚠️ Prvo odaberite učenika i generišite podatke.', 'warning'); return; }

                    const zapisi = realizacijeZa(ime, pg);
                    if (!zapisi.length) {
                        showToast('⚠️ Nema arhiviranih realizacija za ' + POLUGODISTA[pg].naziv
                            + '. Prvo preuzmite Obrazac 15-A · realizacija za periode tog polugodišta.', 'warning');
                        return;
                    }
                    try {
                    const P = POLUGODISTA[pg];
                    const esc = (s) => String(s == null ? '' : s)
                        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
                    const para = (s) => String(s || '').split('\n').filter(x => x.trim())
                        .map(x => '<p>' + esc(x.trim()) + '</p>').join('');

                    // Po periodima — rekapitulacija svake realizacije
                    const sekcije = zapisi.map((z, i) => `
<div class="per">
    <div class="per-hdr">${i+1}. ${esc(z.period)}</div>
    ${z.teme && z.teme.length ? '<div class="per-teme"><b>Obrađene tematske cjeline:</b><ul>'
        + z.teme.map(t => '<li>' + esc(t) + '</li>').join('') + '</ul></div>' : ''}
    <div class="per-ost"><b>Ostvarenost ishoda učenja:</b>${para(z.ostvarenost) || '<p>—</p>'}</div>
</div>`).join('');

                    // Zaključno mišljenje: AI tekst ako postoji, inače sažetak
                    const zakljucak = result?.izvjestaj
                        ? para(result.izvjestaj)
                        : '<p>Učenik je tokom ' + esc(P.opis) + ' radio po prilagođenom programu iz predmeta '
                          + esc(predmet) + '. Realizovano je ' + zapisi.length
                          + ' programskih perioda, a ostvarenost ishoda po periodima data je u pregledu iznad.</p>';

                    const word = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'>
<style>
@page{size:21.0cm 29.7cm;margin:2.0cm}
body{font-family:'Times New Roman',serif;font-size:11pt;line-height:1.5}
h1{font-size:14pt;text-align:center;font-weight:bold;margin:0 0 4pt;text-transform:uppercase}
h2{font-size:11.5pt;text-align:center;font-weight:normal;margin:0 0 18pt;color:#333}
p{margin:6pt 0;text-align:justify}
table.meta{width:100%;border-collapse:collapse;margin-bottom:16pt}
table.meta td{border:1px solid #000;padding:5pt 8pt;font-size:10pt}
table.meta td.k{width:32%;font-weight:bold;background:#f0f0f0}
.sec-lbl{font-size:11pt;font-weight:bold;margin:16pt 0 8pt;padding-bottom:4pt;border-bottom:1.5px solid #000;text-transform:uppercase}
.per{margin-bottom:14pt;padding:8pt 10pt;border:1px solid #999;page-break-inside:avoid}
.per-hdr{font-weight:bold;font-size:11pt;margin-bottom:6pt;padding-bottom:4pt;border-bottom:1px solid #ccc}
.per-teme{font-size:10pt;margin-bottom:6pt}
.per-teme ul{margin:3pt 0 0 18pt;padding:0}
.per-teme li{margin:2pt 0}
.per-ost{font-size:10pt}
.per-ost p{margin:3pt 0}
.sig{margin-top:30pt}
.sl{display:inline-block;min-width:190pt;border-bottom:1px solid #000}
</style></head><body>
<h1>Izvještaj o realizaciji prilagođenog programa</h1>
<h2>${esc(P.naziv)} (${esc(P.opis)}) &middot; školska ${skolskaGodinaGlobal}/${skolskaGodina2}.</h2>

<table class="meta">
<tr><td class="k">Učenik</td><td>${esc(ime)}</td></tr>
<tr><td class="k">Razred</td><td>${esc(u.razred || '')}</td></tr>
<tr><td class="k">Predmet</td><td>${esc(predmet)}</td></tr>
<tr><td class="k">Period praćenja</td><td>${esc(P.opis)}</td></tr>
<tr><td class="k">Broj programskih perioda</td><td>${zapisi.length}</td></tr>
<tr><td class="k">Nastavnik</td><td>${esc(nastavnik || '')}</td></tr>
<tr><td class="k">Škola</td><td>${esc(skola)}</td></tr>
</table>

<div class="sec-lbl">Pregled po programskim periodima</div>
${sekcije}

<div class="sec-lbl">Zaključno mišljenje</div>
${zakljucak}

<div class="sig">
<p style="margin:0">Nastavnik: <span class="sl"></span></p>
<p style="margin:18pt 0 0">Stručni saradnik – pedagog: <span class="sl"></span></p>
<p style="margin:18pt 0 0;font-size:10pt">Datum: ${new Date().toLocaleDateString('bs-BA')}</p>
</div>
</body></html>`;
                    window.__addToLib(word,
                        asciiIme('Izvjestaj_' + (pg === 'I' ? 'I_polugodiste' : 'II_polugodiste')
                        + '_' + ime) + '.doc', 'Prilagođeni');
                    showToast('✅ ' + P.naziv + ' — rekapitulacija ' + zapisi.length + ' perioda.');
                    } catch(err) { showToast('❌ Greška: ' + err.message, 'error'); }
                };

                // ── RENDER ───────────────────────────────────────────────────
                const avatarC = ['linear-gradient(135deg,#e8c84a,#b8900f)','linear-gradient(135deg,#4f8ef7,#3b5fe0)','linear-gradient(135deg,#2dd4bf,#0891b2)','linear-gradient(135deg,#f093fb,#f5576c)','linear-gradient(135deg,#43e97b,#38f9d7)','linear-gradient(135deg,#fa8231,#e55039)'];

                return (
                    <div className="animate-fade-in" style={{display:'flex',flexDirection:'column',gap:'0'}}>
                        {/* ── Lokalni Word download linkovi ── */}
                        <div style={{display:'flex',gap:'20px',alignItems:'flex-start',flexWrap:'wrap'}}>

                        {/* ── Lista učenika (lijevo) ── */}
                        <div style={{width:'210px',flexShrink:0}}>
                            <div style={{background:'linear-gradient(135deg,#1e1b4b,#3730a3)',borderRadius:'14px',padding:'14px',color:'white',marginBottom:'10px'}}>
                                <p style={{fontWeight:800,fontSize:'13px',margin:'0 0 2px'}}>🧩 Prilagođeni program</p>
                                <p style={{fontSize:'11px',opacity:0.7,margin:0}}>Obrazac 15-A · Izvještaj</p>
                            </div>
                            <button onClick={()=>{ setEditing('new'); setEditData({id:'',ime:'',razred:'',datumRodj:'',mjestoRodj:'',adresa:'',kontakt:''}); setSelId(null); setResult(null); }}
                                style={{width:'100%',marginBottom:'8px',padding:'9px',background:'#ecfdf5',border:'1.5px dashed #6ee7b7',borderRadius:'10px',color:'#065f46',fontWeight:700,fontSize:'12px',cursor:'pointer'}}>
                                ➕ Dodaj učenika
                            </button>
                            {učenici.length===0 && <p style={{fontSize:'12px',color:'#9ca3af',textAlign:'center',padding:'12px 0'}}>Nema učenika.<br/>Klikni ➕ da dodaš.</p>}
                            {učenici.map((u,idx)=>(
                                <div key={u.id} onClick={()=>{ setSelId(u.id); setEditing(false); setResult(null); setDijagnoza(''); setOpažanja(''); }}
                                    style={{padding:'10px 12px',borderRadius:'10px',marginBottom:'6px',cursor:'pointer',border:'1.5px solid',borderColor:selId===u.id?'#4f46e5':'#e5e7eb',background:selId===u.id?'#eef2ff':'white',transition:'all 0.15s'}}>
                                    <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
                                        <div style={{width:'28px',height:'28px',borderRadius:'7px',background:avatarC[idx%avatarC.length],display:'flex',alignItems:'center',justifyContent:'center',fontSize:'12px',fontWeight:800,color:'white',flexShrink:0}}>
                                            {(u.ime||'?').charAt(0).toUpperCase()}
                                        </div>
                                        <div style={{minWidth:0}}>
                                            <div style={{fontWeight:700,fontSize:'13px',color:selId===u.id?'#3730a3':'#111827',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{u.ime||'(bez imena)'}</div>
                                            <div style={{fontSize:'11px',color:'#6b7280'}}>{u.razred||'?'}</div>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>

                        {/* ── Desni panel ── */}
                        <div style={{flex:1,minWidth:'300px'}}>

                            {/* Forma za dodavanje/uređivanje */}
                            {editing && (
                                <div style={{background:'#f8fafc',border:'2px solid #e0e7ff',borderRadius:'14px',padding:'20px',marginBottom:'16px'}}>
                                    <h4 style={{margin:'0 0 14px',fontWeight:800,color:'#1e3a8a',fontSize:'15px'}}>
                                        {editing==='new'?'➕ Novi učenik':'✏️ Uredi podatke'}
                                    </h4>
                                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0 16px'}}>
                                        {[['Ime i prezime','ime','npr. Adnan Salkić'],['Razred','razred','npr. 6b'],['Datum rođenja','datumRodj','npr. 13.02.2013.'],['Mjesto rođenja','mjestoRodj','npr. Tuzla'],['Adresa','adresa','npr. Jeginov Lug bb'],['Kontakt','kontakt','npr. Hazim Salkić, 062/..']].map(([lbl,k,ph])=>(
                                            <div key={k} style={{marginBottom:'10px'}}>
                                                <label style={{display:'block',fontSize:'11px',fontWeight:700,color:'#374151',marginBottom:'3px'}}>{lbl}</label>
                                                <input value={editData[k]||''} onChange={e=>setEditData(p=>({...p,[k]:e.target.value}))} placeholder={ph}
                                                    style={{width:'100%',padding:'7px 10px',border:'1.5px solid #d1d5db',borderRadius:'8px',fontSize:'13px',boxSizing:'border-box'}}/>
                                            </div>
                                        ))}
                                    </div>
                                    <div style={{display:'flex',gap:'10px',marginTop:'8px'}}>
                                        <button onClick={saveEdit} style={{background:'linear-gradient(135deg,#1e3a8a,#3b5fe0)',color:'white',border:'none',padding:'10px 22px',borderRadius:'10px',fontWeight:700,cursor:'pointer',fontSize:'13px'}}>💾 Sačuvaj</button>
                                        <button onClick={()=>setEditing(false)} style={{background:'#f1f5f9',border:'1.5px solid #cbd5e1',padding:'10px 18px',borderRadius:'10px',fontWeight:600,cursor:'pointer',fontSize:'13px'}}>Otkaži</button>
                                    </div>
                                </div>
                            )}

                            {/* Generacija kada je učenik odabran */}
                            {selU && !editing && (
                                <div className="space-y-4">
                                    {/* Info učenika */}
                                    <div style={{background:'white',border:'1.5px solid #e5e7eb',borderRadius:'14px',padding:'14px 18px',display:'flex',alignItems:'center',gap:'14px'}}>
                                        <div style={{width:'44px',height:'44px',borderRadius:'12px',background:avatarC[učenici.indexOf(selU)%avatarC.length],display:'flex',alignItems:'center',justifyContent:'center',fontSize:'20px',fontWeight:800,color:'white',flexShrink:0}}>
                                            {(selU.ime||'?').charAt(0).toUpperCase()}
                                        </div>
                                        <div style={{flex:1}}>
                                            <div style={{fontWeight:800,fontSize:'16px',color:'#111827'}}>{selU.ime}</div>
                                            <div style={{fontSize:'12px',color:'#6b7280'}}>Razred {selU.razred||'?'} · {selU.datumRodj||''} {selU.kontakt?'· '+selU.kontakt:''}</div>
                                        </div>
                                        <div style={{display:'flex',gap:'6px'}}>
                                            <button onClick={()=>{ setEditData({...selU}); setEditing(selU.id); }} style={{padding:'6px 12px',background:'#eef2ff',border:'1px solid #c7d2fe',borderRadius:'8px',fontSize:'12px',fontWeight:700,cursor:'pointer',color:'#3730a3'}}>✏️</button>
                                            <button onClick={()=>delU(selU.id)} style={{padding:'6px 12px',background:'#fef2f2',border:'1px solid #fecaca',borderRadius:'8px',fontSize:'12px',fontWeight:700,cursor:'pointer',color:'#dc2626'}}>🗑️</button>
                                        </div>
                                    </div>

                                    {/* Generator forma */}
                                    <div style={{background:'#f8fafc',border:'1.5px solid #e0e7ff',borderRadius:'14px',padding:'18px'}}>
                                        <p style={{fontWeight:700,color:'#3730a3',fontSize:'13px',margin:'0 0 14px'}}>🤖 Generiši prilagođeni program</p>

                                        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px',marginBottom:'12px'}}>
                                            <div>
                                                <label style={{display:'block',fontSize:'11px',fontWeight:700,color:'#374151',marginBottom:'4px'}}>Razred (godišnji plan)</label>
                                                <select value={selRazred} onChange={e=>setSelRazred(e.target.value)}
                                                    style={{width:'100%',padding:'8px',border:'1.5px solid #c7d2fe',borderRadius:'8px',fontSize:'13px'}}>
                                                    <option value="">-- Odaberi --</option>
                                                    {allRazredi.map(r=><option key={r} value={r}>{r}</option>)}
                                                </select>
                                            </div>
                                            <div>
                                                <label style={{display:'block',fontSize:'11px',fontWeight:700,color:'#374151',marginBottom:'4px'}}>Period (mjeseci)</label>
                                                <div style={{display:'flex',flexWrap:'wrap',gap:'4px'}}>
                                                    {SKOL_MJESECI.map(m=>{const s=selMjeseci.includes(m.id);return(
                                                        <button key={m.id} onClick={()=>setSelMjeseci(p=>s?p.filter(x=>x!==m.id):[...p,m.id])}
                                                            style={{padding:'3px 8px',borderRadius:'20px',border:'1.5px solid',borderColor:s?'#4f46e5':'#d1d5db',background:s?'#4f46e5':'white',color:s?'white':'#374151',fontWeight:s?700:500,fontSize:'11px',cursor:'pointer'}}>
                                                            {m.naziv.slice(0,3)}
                                                        </button>
                                                    );})}
                                                </div>
                                            </div>
                                        </div>

                                        <div style={{marginBottom:'12px'}}>
                                            <label style={{display:'block',fontSize:'11px',fontWeight:700,color:'#374151',marginBottom:'4px'}}>
                                                🏥 Dijagnoza / teškoća <span style={{color:'#ef4444'}}>*</span>
                                            </label>
                                            <textarea value={dijagnoza} onChange={e=>setDijagnoza(e.target.value)}
                                                placeholder="Npr: Disleksija, teži oblik. IQ u granicama normale. Ima poteškoća u čitanju i pisanju..."
                                                style={{width:'100%',padding:'10px',border:'1.5px solid #d1d5db',borderRadius:'10px',fontSize:'12px',resize:'vertical',minHeight:'70px',fontFamily:'inherit',boxSizing:'border-box'}}/>
                                        </div>

            const InicijalnaTab = () => {
                const PREV = {'5':'4','6':'5','7':'6','8':'7','9':'8'};

                // Kviz generacija
                const [selRazred, setSelRazred] = useState('');
                const [brPitanja, setBrPitanja] = useState(5);

                const [kvizData, setKvizData]   = useState(null);
