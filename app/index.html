                const [serverIP, setServerIP]     = useState('');
                const [serverPort, setServerPort] = useState(3456);
                const [serverOk, setServerOk]     = useState(false);

                // Rezultati (auto-dolaze ili ručni unos)
                const [rezultati, setRezultati] = useState(() => {
                    try { return JSON.parse(localStorage.getItem('inicijalna_rez') || '{}'); }
                    catch { return {}; }
                });
                const [addRazred, setAddRazred] = useState('');
                const [addIme, setAddIme]       = useState('');
                const [addBod, setAddBod]       = useState('');
                const [addMax, setAddMax]       = useState('5');
                const [showManual, setShowManual] = useState(false);

                const [analizaLoading, setAnalizaLoading] = useState(false);
                const [analizaCache, setAnalizaCache]     = useState({});
                const [activeSubTab, setActiveSubTab]     = useState('kviz');
                const [cekanje, setCekanje]               = useState(false);
                const [noviRezultati, setNoviRezultati]   = useState([]);

                const allRazredi = [...new Set(Object.keys(godisnjePlanove).map(k=>k.split('::')[1]).filter(Boolean))].sort();

                // Sačuvaj rezultate
                const saveRez = (r) => { setRezultati(r); localStorage.setItem('inicijalna_rez', JSON.stringify(r)); };

                // Inicijalizacija: dohvati IP, postavi listener za auto-rezultate
                useEffect(() => {
                    if (!window.electronAPI) return;
                    window.electronAPI.quiz.getIP().then(ip => { setServerIP(ip); setServerOk(!!ip); });
                    window.electronAPI.quiz.getPort().then(p => setServerPort(p));

                    // Automatski prima rezultate od učenika u realnom vremenu
                    window.electronAPI.quiz.onResult((result) => {
                        // Rezultati provjere znanja idu u svoj tab, ne ovdje
                        if (result && result.vrsta === 'provjera') return;
                        setRezultati(prev => {
                            const razred = result.razred || addRazred || '?';
                            const lista  = [...(prev[razred] || [])];
                            // Izbjegni duplikate (isti učenik)
                            if (!lista.find(u => u.ime === result.ime)) lista.push(result);
                            const updated = { ...prev, [razred]: lista };
                            localStorage.setItem('inicijalna_rez', JSON.stringify(updated));
                            return updated;
                        });
                        setNoviRezultati(prev => [...prev, result.ime]);
                        showToast('✅ Primljen rezultat: ' + result.ime);
                        setTimeout(() => setNoviRezultati(prev => prev.filter(x => x !== result.ime)), 4000);
                    });
                }, []);

                // Pomoćnici
                const ocjenaTxt = (b, m) => {
                    if (!m) return '-'; const p = Math.round((b/m)*100);
                    if (p>=91) return '5 — Odličan'; if (p>=80) return '4 — Vrlo dobar';
                    if (p>=65) return '3 — Dobar';   if (p>=50) return '2 — Zadovoljava';
                    return '1 — Nedovoljan';
                };
                const ocjenaBoja = (b, m) => {
                    if (!m) return '#6b7280'; const p = Math.round((b/m)*100);
                    return p>=80?'#16a34a':p>=65?'#ca8a04':p>=50?'#ea580c':'#dc2626';
                };

                // AI: generiši pitanja
                const generirajKviz = async () => {
                    if (!apiKey) { showToast('⚠️ Unesite AI API ključ!','warning'); return; }
                    if (!selRazred) { showToast('⚠️ Odaberite razred!','warning'); return; }
                    setGenLoading(true); setKvizData(null);
                    const prevR   = PREV[selRazred.replace(/[^0-9]/g,'')] || String(parseInt(selRazred)-1);
                    // Inicijalna provjerava gradivo PRETHODNOG razreda → jedinice iz prevR, ne iz selRazred
                    const jedinice = godisnjePlanove[planKey(prevR)] || [];
                    const teme    = jedinice.slice(0,20).join(', ') || ('gradivo ' + prevR + '. razreda iz ' + predmet);
                    const prompt  = 'Generiraj ' + brPitanja + ' pitanja visestru\u010dkog izbora (A/B/C/D) za inicijalnu provjeru znanja.\nPredmet: ' + predmet + '. Gradivo: ' + prevR + '. razreda. Teme: ' + teme + '.\nBosanski ijekavica. SAMO JSON:\n{"naslov":"Inicijalna provjera — ' + predmet + '","razred":"' + selRazred.replace(/[^0-9]/g,'') + '","prevRazred":"' + prevR + '","maxBodova":' + brPitanja + ',"pitanja":[{"br":1,"tekst":"Pitanje?","opcije":["A) ...","B) ...","C) ...","D) ..."],"tacno":"A","objasnjenje":"Razlog..."}]}';
                    try {
                        const raw  = await callAI(prompt,'SAMO JSON, bez markdowna, bosanski ijekavica.');
                        const data = parseAIJson(raw);
                        setKvizData(data);
                        setAddMax(String(data.maxBodova || brPitanja));
                        setAddRazred(selRazred);
                        showToast('✅ ' + (data.pitanja||[]).length + ' pitanja generisana!');

                    finally { setGenLoading(false); }

                const preuzmiKviz = () => {
                    if (!kvizData) return;
                    const { naslov='Kviz', pitanja=[], maxBodova=5, razred:kr='', prevRazred:pr='' } = kvizData;
                    const g1 = skolskaGodinaGlobal.toString().slice(2);
                    const g2 = skolskaGodina2.toString().slice(2);
                    const skl = skola; const nav = nastavnik || '';
                    const srv = serverIP ? ('http://' + serverIP + ':' + serverPort) : '';

                    const html = '<html><head><meta charset="utf-8"><style>@page{size:A4 portrait;margin:2cm 2.5cm}body{font-family:Arial,sans-serif;font-size:11pt}h1{font-size:14pt;font-weight:800;color:#1a1a2e;text-align:center}h2{font-size:12pt;font-weight:700;color:#1a1a2e;border-bottom:1.5pt solid #1a1a2e;padding-bottom:3pt;margin:12pt 0 8pt}table{width:100%;border-collapse:collapse}th{background:#1a1a2e;color:white;padding:5pt 8pt;text-align:left;border:1pt solid #333}td{border:1pt solid #ccc;padding:5pt 8pt}.alt{background:#f8f8f8}</style></head><body><h1>ANALIZA INICIJALNE PROVJERE ZNANJA</h1><table style="border:none;margin-bottom:14pt;font-size:10pt"><tr><td style="border:none;font-weight:700;width:40%">Škola:</td><td style="border:none">'+skola+'</td></tr><tr><td style="border:none;font-weight:700">Predmet:</td><td style="border:none">'+predmet+'</td></tr><tr><td style="border:none;font-weight:700">Razred:</td><td style="border:none">'+raz+'</td></tr><tr><td style="border:none;font-weight:700">Testira gradivo:</td><td style="border:none">'+prevR+'. razreda</td></tr><tr><td style="border:none;font-weight:700">Nastavnik/ca:</td><td style="border:none">'+(nastavnik||'—')+'</td></tr><tr><td style="border:none;font-weight:700">Šk. godina:</td><td style="border:none">20'+g1+'/20'+g2+'.</td></tr><tr><td style="border:none;font-weight:700">Broj učenika:</td><td style="border:none">'+lista.length+'</td></tr></table><h2>Statistički pregled</h2><table style="margin-bottom:8pt"><tr><th>Nivo</th><th>Bodovi %</th><th>Učenika</th><th>% od odjeljenja</th></tr>'+[5,4,3,2,1].map((n,i)=>'<tr'+(i%2?' class="alt"':'')+'><td>'+n+' — '+['Nedovoljan','Zadovoljava','Dobar','Vrlo dobar','Odličan'][n-1]+'</td><td>'+(n===5?'91–100%':n===4?'80–90%':n===3?'65–79%':n===2?'50–64%':'0–49%')+'</td><td style="text-align:center;font-weight:700">'+dist[n]+'</td><td style="text-align:center">'+(lista.length?Math.round(dist[n]/lista.length*100):0)+'%</td></tr>').join('')+'<tr style="background:#e0e7ff"><td colspan="2"><strong>Prosjek</strong></td><td colspan="2" style="text-align:center;font-weight:800">'+avg.toFixed(1)+'%</td></tr></table><h2>Pedagoška analiza</h2>'+anaHtml+'<h2>Pregled po učeniku</h2><table><tr><th>#</th><th>Ime i prezime</th><th>Bodovi</th><th>%</th><th>Ref. nivo</th><th>Datum</th></tr>'+lista.map((u,i)=>{const p=Math.round((u.bodovi/u.maxBodova)*100);return'<tr'+(i%2?' class="alt"':'')+'><td>'+(i+1)+'</td><td>'+u.ime+'</td><td style="text-align:center">'+u.bodovi+'/'+u.maxBodova+'</td><td style="text-align:center">'+p+'%</td><td>'+ocjenaTxt(u.bodovi,u.maxBodova)+'</td><td>'+u.datum+'</td></tr>';}).join('')+'</table><div style="margin-top:28pt;font-size:9.5pt"><p>Nastavnik/ca: <span style="display:inline-block;min-width:150pt;border-bottom:1pt solid #000"></span></p><p style="margin-top:8pt">Pedagog: <span style="display:inline-block;min-width:150pt;border-bottom:1pt solid #000"></span></p><p style="margin-top:8pt">Datum: '+new Date().toLocaleDateString('bs-BA')+'</p><p style="margin-top:10pt;font-size:8pt;color:#666">Napomena: Inicijalna provjera se NE ocjenjuje i NE upisuje u razrednu knjigu (Čl.11 Pravilnika TK 16/2015 TK).</p></div></body></html>';

                    window.__addToLib(html, 'Analiza_inicijalne_'+predmet+'_'+raz+'.doc', 'Inicijalna');
                    showToast('✅ Analiza spremna — otvori 📁 Materijali');
                    } catch(err) { showToast('❌ Greška: '+err.message,'error'); }
                };

                                                {s.slice(3)}

                                                    </div>
                                                </div>
                                            ))}
                                            <div style={{marginTop:'10px',padding:'10px 14px',background:'#fef9c3',borderRadius:'8px',fontSize:'11.5px',color:'#854d0e',lineHeight:'1.6'}}>

                                                3. Učenik upiše ime, odgovori, klikne "Predaj"<br/>
                                                4. Rezultat se automatski šalje ovdje {window.electronAPI?'✅':'(samo Electron verzija)'}<br/>

                                    <span className="mobile-nav-icon">{tab.icon}</span>
                                    <span className="mobile-nav-label">{tab.label}</span>
                                </button>
                            ))}
                        </div>

                        <LibraryPanel />
                    </div>
                    )}
                </div>
            );
        };



        // ╔══════════════════════════════════════════════════════════════╗
        // ║  KOMPONENTA: PrilagođeniTab — Obrazac 15-A + Izvještaj      ║
        // ╚══════════════════════════════════════════════════════════════╝

        const SKOL_MJESECI = [
            { id:'sep', naziv:'Septembar',  br:9  },
            { id:'okt', naziv:'Oktobar',    br:10 },
            { id:'nov', naziv:'Novembar',   br:11 },
            { id:'dec', naziv:'Decembar',   br:12 },
            { id:'jan', naziv:'Januar',     br:1  },
            { id:'feb', naziv:'Februar',    br:2  },
            { id:'mar', naziv:'Mart',       br:3  },
            { id:'apr', naziv:'April',      br:4  },
            { id:'maj', naziv:'Maj',        br:5  },
            { id:'jun', naziv:'Juni',       br:6  },
        ];

        const PRAZNI_UČENIK = {
            id:'', ime:'', datumRodj:'', mjestoRodj:'', adresa:'', kontakt:'', razred:'',
            rjesenjeNum:'', odlukaNV:'',
            proc_iskustvo:'', proc_prostor:'', proc_emocije:'',
            proc_kognitivne:'', proc_paznja:'', proc_grafo:'',
            proc_komunik:'', proc_ponasanje:'',
        };

        // ── Forma za učenika (dodaj / uredi)
        const UčenikForma = ({ initial, onSave, onCancel }) => {
            const [d, setD] = useState({ ...PRAZNI_UČENIK, ...initial });
            const set = (k, v) => setD(prev => ({ ...prev, [k]: v }));
            const inp = (label, k, placeholder='', tip='text') => (
                <div style={{marginBottom:'10px'}}>
                    <label style={{display:'block',fontSize:'11px',fontWeight:700,color:'#374151',marginBottom:'3px'}}>{label}</label>
                    {tip==='textarea' ?
                        <textarea value={d[k]||''} onChange={e=>set(k,e.target.value)} placeholder={placeholder}
                            style={{width:'100%',padding:'7px 10px',border:'1.5px solid #d1d5db',borderRadius:'8px',fontSize:'12px',resize:'vertical',minHeight:'60px',fontFamily:'inherit',boxSizing:'border-box'}}/>
                        :
                        <input type="text" value={d[k]||''} onChange={e=>set(k,e.target.value)} placeholder={placeholder}
                            style={{width:'100%',padding:'7px 10px',border:'1.5px solid #d1d5db',borderRadius:'8px',fontSize:'13px',boxSizing:'border-box'}}/>
                    }
                </div>
            );
            return (
                <div style={{background:'#f8fafc',border:'2px solid #e0e7ff',borderRadius:'14px',padding:'20px',marginBottom:'16px'}}>
                    <h4 style={{margin:'0 0 14px',fontWeight:800,color:'#1e3a8a',fontSize:'15px'}}>
                        {initial?.id ? '✏️ Uredi podatke učenika' : '➕ Novi učenik'}
                    </h4>
                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0 16px'}}>
                        {inp('Ime i prezime','ime','npr. Adnan Salkić')}
                        {inp('Razred','razred','npr. 6b')}
                        {inp('Datum rođenja','datumRodj','npr. 13.02.2013.')}
                        {inp('Mjesto rođenja','mjestoRodj','npr. Tuzla')}
                        {inp('Adresa stanovanja','adresa','npr. Jeginov Lug')}
                        {inp('Kontakt (roditelj/tel)','kontakt','npr. Hazim Salkić, 062/716-667')}
                    </div>
                    <p style={{fontWeight:700,color:'#6b21a8',fontSize:'12px',textTransform:'uppercase',letterSpacing:'1px',margin:'12px 0 8px',borderTop:'1px solid #e0e7ff',paddingTop:'10px'}}>📋 Inicijalna procjena — Opservacija i potencijali</p>
                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0 16px'}}>
                        {inp('Iskustvo učenika','proc_iskustvo','Iskustvo u radu, navike...','textarea')}
                        {inp('Vremenska i prostorna orijentacija','proc_prostor','Orijentacija u prostoru i vremenu...','textarea')}
                        {inp('Opservacija emocija','proc_emocije','Emocionalne reakcije, stabilnost...','textarea')}
                        {inp('Kognitivne mogućnosti','proc_kognitivne','Pažnja, pamćenje, razumijevanje...','textarea')}
                        {inp('Opservacija pažnje i interesa','proc_paznja','Fokus, interesovanje za teme...','textarea')}
                        {inp('Grafomotoričke sposobnosti','proc_grafo','Pisanje, koordinacija, rukopis...','textarea')}
                        {inp('Komunikacijske sposobnosti','proc_komunik','Govor, izražavanje, komunikacija...','textarea')}
                        {inp('Ponašanje','proc_ponasanje','Ponašanje na času, saradnja...','textarea')}
                    </div>
                    <div style={{display:'flex',gap:'10px',marginTop:'10px'}}>
                        <button onClick={()=>onSave(d)} style={{background:'linear-gradient(135deg,#1e3a8a,#3b5fe0)',color:'white',border:'none',padding:'10px 22px',borderRadius:'10px',fontWeight:700,cursor:'pointer',fontSize:'13px'}}>
                            💾 Sačuvaj
                        </button>
                        <button onClick={onCancel} style={{background:'#f1f5f9',border:'1.5px solid #cbd5e1',padding:'10px 18px',borderRadius:'10px',fontWeight:600,cursor:'pointer',fontSize:'13px'}}>
                            Otkaži
                        </button>
                    </div>
                </div>
            );
        };


        // ─── Electron info baner (prikazuje se u PodaciTab) ──────────────
        const ElectronInfoBanner = () => {
            const [info, setInfo] = React.useState(null);
            React.useEffect(() => {
                window.electronAPI.getInfo().then(setInfo);
            }, []);
            if (!info) return null;
            return (
                <div style={{marginTop:'8px',padding:'10px 14px',background:'rgba(79,142,247,0.08)',border:'1px solid rgba(79,142,247,0.2)',borderRadius:'10px',fontSize:'12px',color:'#374151'}}>
                    <span style={{fontWeight:700,color:'#1a2b6b'}}>📁 Folder s podacima: </span>
                    <span style={{fontFamily:'monospace',fontSize:'11px',color:'#4f8ef7'}}>{info.userData}</span>
                </div>
            );
        };

        // ╔══════════════════════════════════════════════════════════════╗
        // ║  LICENCNA ZAŠTITA — Generator nastavnih materijala          ║
        // ║  Fingerprint → Aktivacijski ključ → Provjera                ║
        // ╚══════════════════════════════════════════════════════════════╝

        // Pokretanje aplikacije
        const bootApp = () => {
            ReactDOM.createRoot(document.getElementById('root')).render(<NastavniPlanGenerator />);
        };
        bootApp();
    </script>
</body>
</html>
