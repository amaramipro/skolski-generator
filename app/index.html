                    if (v !== null) setDarkMode(!!v);
                });
            }, []);

            // ── AI cache — jednom generisan sadržaj se ne šalje ponovo ──────
            // Ključ = jednostavan hash prompta+providera+modela. Sprema u localStorage.
            const [aiCacheOn, setAiCacheOn] = useState(() =>
                (localStorage.getItem('aiCacheOn') ?? 'true') === 'true'
            );
            useEffect(() => { localStorage.setItem('aiCacheOn', aiCacheOn); }, [aiCacheOn]);

            const _hashStr = (str) => {
                let h = 0;
                for (let i = 0; i < str.length; i++) {
                    h = ((h << 5) - h + str.charCodeAt(i)) | 0;
                }
                return 'aic_' + Math.abs(h).toString(36);
            };
            const _cacheModel = () => aiProvider === 'ollama' ? ollamaModel : aiProvider === 'openrouter' ? orModel : aiProvider;
            const getCached = (prompt, sys) => {
                if (!aiCacheOn) return null;
                try { return localStorage.getItem(_hashStr(_cacheModel() + '|' + (sys||'') + '|' + prompt)); }
                catch { return null; }
            };
            const setCached = (prompt, sys, result) => {
                if (!aiCacheOn || !result) return;
                try { localStorage.setItem(_hashStr(_cacheModel() + '|' + (sys||'') + '|' + prompt), result); }
                catch(e) {
                    // localStorage pun — očisti stare aic_ ključeve
                    try {
                        Object.keys(localStorage).filter(k => k.startsWith('aic_')).slice(0, 20).forEach(k => localStorage.removeItem(k));
                        localStorage.setItem(_hashStr(_cacheModel() + '|' + (sys||'') + '|' + prompt), result);
                    } catch(_) {}
                }
            };
            const clearAiCache = () => {
                Object.keys(localStorage).filter(k => k.startsWith('aic_')).forEach(k => localStorage.removeItem(k));
                showToast('🗑️ AI cache obrisan');
            };

            // ── AI helper — podržava Gemini, Ollama, OpenRouter, OpenAI, Claude ──
            const callAI = async (prompt, systemPrompt) => {
                const sys = systemPrompt || 'Ti si stručni pomoćnik za nastavnike u osnovnim školama u Bosni i Hercegovini. Odgovaraj na bosanskom jeziku (ijekavica, latinica). Budi koncizan.';

                // Cache: ako je isti zahtjev već generisan, vrati ga bez slanja AI-u
                const cached = getCached(prompt, sys);
                if (cached) return cached;

                // Ollama ne treba ključ; ostali trebaju
                const needsKey = aiProvider !== 'ollama';
                if (needsKey && !apiKey) {
                    showToast('⚠️ Unesite API ključ za ' + aiProvider + '!', 'warning');
                    return null;
                }

                try {
                    // ═══ OLLAMA (lokalno, besplatno) ═══
                    if (aiProvider === 'ollama') {
                        const response = await fetch(ollamaUrl.replace(/\/$/, '') + '/api/generate', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                model: ollamaModel,
                                prompt: sys + '\n\n' + prompt,
                                stream: false,
                                options: { temperature: 0.7 }
                            })
                        });
                        if (!response.ok) {
                            showToast('Ollama greška — je li Ollama pokrenut? (ollama serve)', 'error');
                            return null;
                        }
                        const data = await response.json();
                        const _r = data?.response || null;
                        setCached(prompt, sys, _r);
                        return _r;
                    }

                    // ═══ CLAUDE (Anthropic) ═══
                    if (aiProvider === 'claude' || apiKey.startsWith('sk-ant-')) {
                        const response = await fetch('https://api.anthropic.com/v1/messages', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'x-api-key': apiKey,
                                'anthropic-version': '2023-06-01',
                                'anthropic-dangerous-direct-browser-access': 'true'
                            },
                            body: JSON.stringify({
                                model: 'claude-sonnet-4-6',
                                max_tokens: 4000,
                                system: sys,
                                messages: [{ role: 'user', content: prompt }]
                            })
                        });
                        const data = await response.json();
                        if (data.content && data.content[0]) { setCached(prompt, sys, data.content[0].text); return data.content[0].text; }
                        if (data.error) showToast('Claude: ' + (data.error.message||'greška'), 'error');
                        return null;
                    }

                    // ═══ OPENROUTER (više modela, jedan ključ) ═══
                    if (aiProvider === 'openrouter') {
                        const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': 'Bearer ' + apiKey,
                                'HTTP-Referer': 'https://generator-nastavnih.local',
                                'X-Title': 'Generator nastavnih materijala'
                            },
                            body: JSON.stringify({
                                model: orModel,
                                messages: [
                                    { role: 'system', content: sys },
                                    { role: 'user', content: prompt }
                                ]
                            })
                        });
                        if (!response.ok) {
                            const err = await response.json().catch(()=>({}));
                            showToast('OpenRouter: ' + (err.error?.message || 'model možda nedostupan'), 'error');
                            return null;
                        }
                        const data = await response.json();
                        const _r = data?.choices?.[0]?.message?.content || null;
                        setCached(prompt, sys, _r);
                        return _r;
                    }

                    // ═══ OPENAI ═══
                    if (aiProvider === 'openai' || apiKey.startsWith('sk-proj-') || apiKey.startsWith('sk-')) {
                        const response = await fetch('https://api.openai.com/v1/chat/completions', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': 'Bearer ' + apiKey
                            },
                            body: JSON.stringify({
                                model: 'gpt-4o-mini',
                                messages: [
                                    { role: 'system', content: sys },
                                    { role: 'user', content: prompt }
                                ]
                            })
                        });
                        if (!response.ok) {
                            const err = await response.json().catch(()=>({}));
                            showToast('OpenAI: ' + (err.error?.message || 'provjerite ključ'), 'error');
                            return null;
                        }
                        const data = await response.json();
                        const _r = data?.choices?.[0]?.message?.content || null;
                        setCached(prompt, sys, _r);
                        return _r;
                    }

                    // ═══ GEMINI (default) — gemini-2.5-flash ═══
                    {
                        const fullPrompt = sys + '\n\n' + prompt;
                        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
                        const response = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: fullPrompt }] }],
                                generationConfig: { temperature: 0.7, topP: 0.95, topK: 64 }
                            })
                        });
                        if (!response.ok) {
                            const errData = await response.json().catch(()=>({}));
                            console.error('Gemini API greška:', errData);
                            if (response.status === 404) return callAI_Fallback(prompt, sys);
                            showToast(`Gemini: ${errData.error?.message || 'Provjerite ključ'}`, 'error');
                            return null;
                        }
                        const data = await response.json();
                        const _r = data?.candidates?.[0]?.content?.parts?.[0]?.text || null;
                        setCached(prompt, sys, _r);
                        return _r;
                    }
                } catch (e) {
                    console.error('AI mrežna greška:', e);
                    if (aiProvider === 'ollama') {
                        showToast('Ne mogu se povezati s Ollama. Pokrenite: ollama serve', 'error');
                    } else {
                        showToast('Nema interneta ili je API blokiran.', 'error');
                    }
                    return null;
                }
            };

            // Fallback: gemini-2.5-flash-lite ako 2.5-flash nije dostupan
            const callAI_Fallback = async (prompt, sys) => {
                try {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${apiKey}`;
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: sys + '\n\n' + prompt }] }] })
                    });
                    const data = await response.json();
                    return data?.candidates?.[0]?.content?.parts?.[0]?.text || null;
                } catch(e) {
                    showToast('Gemini fallback greška. Provjerite ključ.', 'error');
                    return null;
                }
            };
            // nastavnici: { 'Predmet': ['Ime1', 'Ime2', ...], ... }
            const [nastavnici, setNastavnici] = useState(initData.nastavnici);
            // Nastavnici za aktivni predmet
            const nastavniciLista = nastavnici[predmet] || [];
            // Nastavnik = ime aktivnog profila (naziv profila JE ime nastavnika)
            // ─── MASTER PIN & verifyPin — unutar komponente (kao pravi React state) ──
            const [masterPin, setMasterPin] = useState(() =>
                localStorage.getItem('app_master_pin') || '1234'
            );
            useEffect(() => { localStorage.setItem('app_master_pin', masterPin); }, [masterPin]);
            const verifyPin = (profile, entered) => {
                if (!profile?.pin) return true;
                return entered === profile.pin || entered === masterPin;
            };

            const activeProfileLabel = profiles.find(p => p.id === activeProfileId)?.label || '';
            const nastavnik = activeProfileLabel || nastavniciLista[0] || '';
            // Priprema podešavanja: { 'Predmet': { uputa: '...', kurikulum: '...' } }
            const [pripPodesavanja, setPripPodesavanja] = useState(initData.pripPodesavanja);

            // ── Sekcije (godišnji plan + progres) ────────────────────
            const [sekcijePlanove, setSekcijePlanove] = useState(initData.sekcijePlanove);
            const [sectionProgressIndex, setSectionProgressIndex] = useState(initData.sectionProgressIndex);

            // ── Raspored zvonjenja (globalni) ────────────────────────
            const defaultZvonjenje = {
                smjena1: [
                    { cas: 1, pocetak: '07:00', kraj: '07:45' },
                    { cas: 2, pocetak: '07:50', kraj: '08:35' },

                    { cas: 6, pocetak: '17:20', kraj: '18:05' }
                ],
                sekcija: { pocetak: '12:10', kraj: '12:55' },
                trajanjeCasa: 45, maliOdmor: 5,
                velikiOdmor1: { nakonCasa: 3, trajanje: 15 },
                velikiOdmor2: { nakonCasa: 2, trajanje: 15 }

            const [rasporedZvonjenja, setRasporedZvonjenja] = useState(() => {
                try { const s = localStorage.getItem('rasporedZvonjenja'); return s ? JSON.parse(s) : defaultZvonjenje; }

            useEffect(() => { localStorage.setItem('rasporedZvonjenja', JSON.stringify(rasporedZvonjenja)); }, [rasporedZvonjenja]);

            // Lista naziva sekcija (izvlači se iz sekcijePlanove ključeva)
            const sekcijaNazivi = Object.keys(sekcijePlanove);

            const updatePripPod = (field, val) => {
                setPripPodesavanja(prev => ({
                    ...prev,
                    [predmet]: { ...(prev[predmet]||{}), [field]: val }
                }));

            const [skola, setSkola] = useState(() => {
                // Skola je globalna (dijele svi profili iste škole)

            const [grupeMode, setGrupeMode] = useState(initData.grupeMode);
            const [godisnjePlanove, setGodisnjePlanove] = useState(initData.godisnjePlanove);
            const [rasporedA, setRasporedA] = useState(initData.rasporedA);
            const [rasporedB, setRasporedB] = useState(initData.rasporedB);
            const [neradniDani, setNeradniDani] = useState(initData.neradniDani);
            const [rasporedPeriodi, setRasporedPeriodi] = useState(initData.rasporedPeriodi);

            // ── BiH PRAZNICI: editabilna lista sa nazivom i datumom ──────────
            const defaultBihPraznici = (yr1, yr2) => [
                { id:'nG1',  naziv:'Nova godina (1. jan)',      datum:`${yr2}-01-01`, aktivan:true },
                { id:'nG2',  naziv:'Nova godina (2. jan)',      datum:`${yr2}-01-02`, aktivan:true },
                { id:'dNez', naziv:'Dan nezavisnosti (1. mart)',datum:`${yr2}-03-01`, aktivan:true },

            // Parsira '2025-11-23' kao LOKALNI datum (ne UTC) - izbjegava timezone pomak
            const parseLocalDate = (dateStr) => {
                const [y, m, d] = dateStr.split('-').map(Number);
                return new Date(y, m - 1, d);
            };

            // Datum → 'YYYY-MM-DD' koristeći lokalne vrijednosti
            const toLocalDateStr = (date) => {
                const y = date.getFullYear();
                const m = String(date.getMonth() + 1).padStart(2, '0');
                const d = String(date.getDate()).padStart(2, '0');
                return `${y}-${m}-${d}`;

            // ═══════════════════════════════════════════════════════
            // DIJELJENI KALENDARSKI HELPERI (koriste DokumentiExport i MjesecniExport)
            // ═══════════════════════════════════════════════════════
            const DANI_TJEDAN = ['Ponedjeljak','Utorak','Srijeda','Četvrtak','Petak'];

            // Koji raspored (A ili B) je aktivan za ponedjeljak date sedmice?
            const getRasporedForWeekGlobal = (monday) => {
                for (const period of rasporedPeriodi) {
                    const ps = parseLocalDate(period.start), pe = parseLocalDate(period.end);
                    if (monday >= ps && monday <= pe) return period.raspored === 'A' ? rasporedA : rasporedB;
                }
                return rasporedA;
            };

            // Vraća sve kalendarske sedmice u mjesecu (Monday >= 1. tog mjeseca),
            // sa tačnim brojem časova za odjeljenje (isključuje neradne dane).
            const getWeeksForMonthGlobal = (monthIndex, year, odjeljenje) => {
                const weeks = [];
                const firstOfMonth = new Date(year, monthIndex, 1);
                const lastOfMonth  = new Date(year, monthIndex + 1, 0);
                let mon = new Date(firstOfMonth);
                const dow0 = (mon.getDay() + 6) % 7;
                if (dow0 !== 0) mon.setDate(mon.getDate() + (7 - dow0));
                while (mon <= lastOfMonth) {
                    const fri = new Date(mon.getTime() + 4 * 864e5);
                    const sched = getRasporedForWeekGlobal(mon);
                    let casova = 0;
                    for (let d = 0; d < 5; d++) {
                        const dayDate = new Date(mon.getTime() + d * 864e5);
                        const ds = toLocalDateStr(dayDate);
                        const isWeekend = (dayDate.getDay() + 6) % 7 >= 5;
                        if (!isWeekend && !neradniDani.includes(ds)) {
                            const dayName = DANI_TJEDAN[d];
                            Object.values(sched[dayName] || {}).forEach(slot => {
                                // UVIJEK egzaktni match po odjeljenju — NE po razredu.
                                // Bug koji je bio: grupeMode je matchao sve razrede (7a + 7b).
                                // Primjer: 7a ima čas ponedjeljkom, 7b srijedom.
                                // Ponedjeljak neradni → 7a ima casova=0 za tu sedmicu ✓
                                // Ali stara grupeMode logika je PRIBROJALA i 7b-inu srijedu
                                // → casova=1 → sedmica i dalje bila "aktivna" za 7a ✗
                                // Egzaktni match: 7a gleda SAMO 7a-ine slotove. ✓
                                if (slot.razred === odjeljenje) casova++;
                            });
                        }
                    }
                    weeks.push({ mon: new Date(mon), fri: new Date(fri), casova });
                    mon = new Date(mon.getTime() + 7 * 864e5);
                }
                return weeks;
            };

            // Aktivne sedmice = one gdje odjeljenje ima bar 1 čas
            const getActiveWeeksGlobal = (monthIndex, year, odjeljenje) =>
                getWeeksForMonthGlobal(monthIndex, year, odjeljenje).filter(w => w.casova > 0);

            // Raspored školskih mjeseci kroz godinu
            const SKOLSKI_MJESECI = [

            const getCalendarByMonth = (odjeljenje) => {

                SKOLSKI_MJESECI.forEach(m => {
                    const yr = m.i >= 8 ? parseInt(skolskaGodinaGlobal) : parseInt(skolskaGodina2);
                    result[m.n] = getActiveWeeksGlobal(m.i, yr, odjeljenje);

            // Zajednička logika za obradu uvezenih podataka

                            setGodisnjePlanove(backup.godisnjePlanove || {});
                            setRasporedA(backup.rasporedA || {});
                            setRasporedB(backup.rasporedB || {});
                            setNeradniDani(backup.neradniDani || []);
                            setRasporedPeriodi(backup.rasporedPeriodi || []);
                            setSkola(backup.skola || '');
                            if (backup.nastavnici) setNastavnici(backup.nastavnici);
                            else if (backup.nastavnik) setNastavnici({ [backup.predmet||'Informatika']: [backup.nastavnik] });
                            if (backup.classProgressIndex) setClassProgressIndex(backup.classProgressIndex);
                            if (backup.bihPraznici) setBihPraznici(backup.bihPraznici);
                            if (backup.rasporedZvonjenja) setRasporedZvonjenja(backup.rasporedZvonjenja);
                            if (backup.predmeti) setPredmeti(backup.predmeti);
                            if (backup.predmet) setPredmet(backup.predmet);
                            if (backup.mjesto) setMjesto(backup.mjesto);
                            if (backup.skolskaGodinaGlobal) setSkolskaGodinaGlobal(backup.skolskaGodinaGlobal);
                            if (backup.skolskaGodina2) setSkolskaGodina2(backup.skolskaGodina2);
                            showToast('\u2705 Podaci uspje\u0161no u\u010ditani!');
                            closeModal();
                        }, { detail: 'Fajl: ' + (fileName||'backup.json') + '\nVerzija: ' + (backup.version || '?'), type: 'info', confirmText: '\uD83D\uDCE5 U\u010ditaj' });
                    } else {

            const handleImport = (e) => {

            const handleExport = async () => {

                };
                const jsonStr = JSON.stringify(backupData, null, 2);
                const d = new Date();

                const activeProfile = profiles.find(p => p.id === activeProfileId);
                const activeLabel = (activeProfile ? activeProfile.label : 'backup')

            useEffect(() => {

            const GodisnjPlanEditor = () => {

                        {editingSlot && (
                            <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 p-4">

                                                {editingSlot.dan}, {editingSlot.cas === 7 ? '📗 Aktivnost (međusmjena)' : editingSlot.cas + '. čas'}

                                        {/* ── SEKCIJA (čas 7): samo naziv sekcije ── */}
                                        {editingSlot.cas === 7 ? (
                                            <div>
                                                <label className="block text-sm font-bold text-emerald-700 mb-2">
                                                    📗 Izaberite aktivnost
                                                </label>

                                                    <select
                                                        value={slotData.sekcijaNaziv || ''}
                                                        onChange={(e) => setSlotData({ ...slotData, sekcijaNaziv: e.target.value, razred: e.target.value })}

                                                    💡 Više razreda može pohađati istu sekciju. Godišnji plan sekcije uređujete u tabu "📚 Godišnji plan" → režim "📗 Sekcije".

                                                {slotData.sekcijaNaziv && (sekcijePlanove[slotData.sekcijaNaziv]||[]).length > 0 && (

                                                        onChange={(e) => setSlotData({ ...slotData, razred: e.target.value })}
                                                        className="w-full px-4 py-4 border-2 border-gray-300 rounded-xl text-lg focus:ring-4 focus:ring-indigo-200 focus:border-indigo-400 font-semibold"
                                                    >

                                                        {['1','2','3','4','5','6','7','8','9'].map(razred => (

                                                                {svaOdjeljenja.filter(r => r.startsWith(razred)).map(r => (
                                                                    <option key={r} value={r}>{r.toUpperCase()}</option>

                                                    <label className="block text-sm font-bold text-gray-700 mb-2">
                                                        Smjena
                                                    </label>
                                                    <select
                                                        value={slotData.smjena}
                                                        onChange={(e) => setSlotData({ ...slotData, smjena: e.target.value })}
                                                        className="w-full px-4 py-4 border-2 border-gray-300 rounded-xl text-lg focus:ring-4 focus:ring-indigo-200 focus:border-indigo-400 font-semibold"
                                                    >

                                                        <option value="2">2. smjena</option>
                                                    </select>

                                            <button
                                                onClick={() => {

                                                        if (slotData.sekcijaNaziv) {
                                                            updateSlot(editingSlot.dan, editingSlot.cas, {
                                                                razred: slotData.sekcijaNaziv,
                                                                smjena: 'S',
                                                                sekcijaNaziv: slotData.sekcijaNaziv,
                                                                isSekcija: true
                                                            });
                                                            setEditingSlot(null);
                                                            setIsEditMode(false);
                                                        }
                                                    } else {
                                                        if (slotData.razred) {
                                                            updateSlot(editingSlot.dan, editingSlot.cas, slotData);
                                                            setEditingSlot(null);
                                                            setIsEditMode(false);
                                                        }

                                                className={`flex-1 text-white px-6 py-4 rounded-xl font-extrabold text-lg ${editingSlot.cas===7 ? 'bg-emerald-600 hover:bg-emerald-700' : 'btn-success'}`}
                                            >

                                                onClick={() => { setEditingSlot(null); setIsEditMode(false); }}

                                    </div>

                        )}
                    </div>
                );
            };


            // =============================================
            // KOMPONENTA: RasporedZvonjenja (samo vremena)
            // =============================================
            const RasporedZvonjenja = () => {
                const zv = rasporedZvonjenja;
                const updateCas = (smjKey, idx, field, val) => {
                    setRasporedZvonjenja(prev => {
                        const arr = [...prev[smjKey]];
                        arr[idx] = { ...arr[idx], [field]: val };
                        return { ...prev, [smjKey]: arr };
                    });
                };
                const updateSek = (f, v) => setRasporedZvonjenja(prev => ({...prev, sekcija:{...prev.sekcija,[f]:v}}));

                const renderSmjena = (label, key, num, voKey) => {
                    const arr = zv[key]; const vo = zv[voKey];
                    return (
                        <div className="bg-white rounded-2xl card-shadow-xl overflow-hidden">
                            <div className={`px-6 py-3 text-white font-extrabold ${num===1?'bg-gradient-to-r from-blue-600 to-indigo-600':'bg-gradient-to-r from-purple-600 to-pink-600'}`}>{label}</div>
                            <div className="p-4 space-y-1">
                                {arr.map((c,i) => (
                                    <React.Fragment key={c.cas}>
                                        <div className="flex items-center gap-3 p-2 bg-gray-50 rounded-lg">
                                            <span className={`w-8 h-8 flex items-center justify-center rounded-lg font-extrabold text-white text-sm ${num===1?'bg-indigo-600':'bg-purple-600'}`}>{c.cas}</span>
                                            <input type="time" value={c.pocetak} onChange={e=>updateCas(key,i,'pocetak',e.target.value)} className="px-2 py-1.5 border-2 border-gray-300 rounded-lg font-semibold text-sm" />
                                            <span className="text-gray-400">—</span>
                                            <input type="time" value={c.kraj} onChange={e=>updateCas(key,i,'kraj',e.target.value)} className="px-2 py-1.5 border-2 border-gray-300 rounded-lg font-semibold text-sm" />
                                        </div>
                                        {c.cas === vo.nakonCasa && <div className="px-4 py-1 bg-amber-50 border-l-4 border-amber-400 rounded-r-lg text-amber-600 font-bold text-xs">☕ VELIKI ODMOR — {vo.trajanje} min</div>}
                                    </React.Fragment>
                                ))}
                            </div>
                        </div>
                    );
                };

                return (
                    <div className="space-y-6 animate-fade-in">
                        <div className="bg-gradient-to-r from-amber-50 to-orange-50 border-l-4 border-amber-600 rounded-xl p-6 card-shadow-lg">
                            <h4 className="font-bold text-amber-900 text-lg mb-2">🔔 Raspored zvonjenja</h4>
                            <p className="text-amber-700">Vremena časova i odmora za obje smjene. Sekcija se održava između smjena.</p>
                        </div>
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                            {renderSmjena('☀️ I smjena', 'smjena1', 1, 'velikiOdmor1')}
                            {renderSmjena('🌙 II smjena', 'smjena2', 2, 'velikiOdmor2')}
                        </div>
                        <div className="bg-white rounded-2xl card-shadow-xl overflow-hidden">
                            <div className="px-6 py-3 bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-extrabold">📗 Aktivnost (međusmjena)</div>
                            <div className="p-4 flex items-center gap-4">
                                <span className="text-2xl">📗</span>
                                <input type="time" value={zv.sekcija.pocetak} onChange={e=>updateSek('pocetak',e.target.value)} className="px-3 py-2 border-2 border-emerald-300 rounded-lg font-semibold" />
                                <span className="text-gray-400 font-bold">—</span>
                                <input type="time" value={zv.sekcija.kraj} onChange={e=>updateSek('kraj',e.target.value)} className="px-3 py-2 border-2 border-emerald-300 rounded-lg font-semibold" />
                                <span className="text-sm text-emerald-700 font-semibold ml-auto">Između I i II smjene</span>
                            </div>
                        </div>
                        <button onClick={() => { showConfirm('Resetovati raspored zvonjenja?', () => { setRasporedZvonjenja(defaultZvonjenje); closeModal(); showToast('✅ Reset!'); }, {type:'warning'}); }}
                            className="bg-gray-500 hover:bg-gray-600 text-white px-6 py-3 rounded-xl font-bold">🔄 Reset na default</button>
                    </div>
                );
            };

            const NeradniDaniCalendar = () => {
                const [selectedMonth, setSelectedMonth] = useState(() => {
                    const saved = localStorage.getItem('selectedMonth');
                    return saved ? parseInt(saved) : new Date().getMonth();
                });
                const [selectedYear, setSelectedYear] = useState(() => {
                    const saved = localStorage.getItem('selectedYear');
                    return saved ? parseInt(saved) : new Date().getFullYear();
                });
                const [skolskaGodina, setSkolskaGodina] = useState(() => {
                    const saved = localStorage.getItem('skolskaGodina');
                    return saved ? saved : new Date().getFullYear().toString();
                });
                const [showAddPeriod, setShowAddPeriod] = useState(false);
                const [newPeriod, setNewPeriod] = useState({ start: '', end: '', raspored: 'A' });

                useEffect(() => {
                    localStorage.setItem('skolskaGodina', skolskaGodina);
                }, [skolskaGodina]);

                useEffect(() => {
                    localStorage.setItem('selectedMonth', selectedMonth.toString());
                }, [selectedMonth]);

                useEffect(() => {
                    localStorage.setItem('selectedYear', selectedYear.toString());
                }, [selectedYear]);

                const toggleNeradniDan = (date) => {
                    const d = new Date(date);
                    const dateStr = d.getFullYear() + '-' + 
                                    String(d.getMonth() + 1).padStart(2, '0') + '-' + 
                                    String(d.getDate()).padStart(2, '0');
                    
                    setNeradniDani(prev => {
                        if (prev.includes(dateStr)) {
                            return prev.filter(d => d !== dateStr);
                        } else {
                            return [...prev, dateStr];
                        }
                    });
                };

                // Koristi zajednički helper (izbjegava duplikaciju koda)
                const isNeradni = createIsNeradni(neradniDani);

                const getDaysInMonth = () => {
                    const firstDay = new Date(selectedYear, selectedMonth, 1);
                    const lastDay = new Date(selectedYear, selectedMonth + 1, 0);
                    const days = [];
                    
                    for (let i = 0; i < (firstDay.getDay() + 6) % 7; i++) {
                        days.push(null);
                    }
                    
                    for (let i = 1; i <= lastDay.getDate(); i++) {
                        days.push(new Date(selectedYear, selectedMonth, i));
                    }
                    
                    return days;
                };

                const setupAutomaticPeriods = () => {
                    const year = parseInt(skolskaGodina);
                    const periods = [
                        { start: `${year}-09-01`, end: `${year}-09-30`, raspored: 'A' },
                        { start: `${year}-10-01`, end: `${year}-10-31`, raspored: 'B' },
                        { start: `${year}-11-01`, end: `${year}-11-30`, raspored: 'A' },
                        { start: `${year}-12-01`, end: `${year}-12-31`, raspored: 'B' },
                        { start: `${year + 1}-01-01`, end: `${year + 1}-01-31`, raspored: 'A' }, // Januar (zimski raspust)
                        { start: `${year + 1}-02-01`, end: `${year + 1}-02-28`, raspored: 'A' }, // Februar A
                        { start: `${year + 1}-03-01`, end: `${year + 1}-03-31`, raspored: 'B' },
                        { start: `${year + 1}-04-01`, end: `${year + 1}-04-30`, raspored: 'A' },
                        { start: `${year + 1}-05-01`, end: `${year + 1}-05-31`, raspored: 'B' },
                        { start: `${year + 1}-06-01`, end: `${year + 1}-06-30`, raspored: 'A' },
                    ];
                    setRasporedPeriodi(periods.sort((a, b) => parseLocalDate(a.start) - parseLocalDate(b.start)));
                    showToast('✅ Periodi automatski postavljeni! Smjene se mijenjaju svaki mjesec.');
                };

                const ucitajPraznikeBiH = () => {
                    const year = parseInt(skolskaGodina) + 1; // Za sljedeću kalendarsku godinu
                    const praznici = [
                        `${year}-01-01`, `${year}-01-02`, // Nova godina
                        `${year}-03-01`, `${year}-03-02`, // Dan nezavisnosti (preneseno)
                        `${year}-03-20`,               // Ramazanski bajram (okvirno)
                        `${year}-04-05`, `${year}-04-06`, // Uskrs/Vaskrs ponedjeljak
                        `${year}-05-01`, `${year}-05-02`, // Praznik rada
                        `${year}-05-27`,               // Kurban bajram (okvirno)
                        `${year}-11-21`,               // DAN ŠKOLE (JU OŠ "Rainci Gornji")
                        `${year}-11-25`                // Dan državnosti
                    ];
                    setNeradniDani(prev => [...new Set([...prev, ...praznici])]);
                    showToast('✅ Praznici i Dan škole (21.11.) su uspješno označeni!');
                };

                const addZimskiRaspust = () => {
                    const year = parseInt(skolskaGodina) + 1;
                    const newNeradni = [...neradniDani];
                    // Koristi Date API za tačan broj dana u januaru (uvijek 31, ali ovako je generalno)
                    const daysInJanuary = new Date(year, 1, 0).getDate(); // month=1 (feb), day=0 = zadnji dan januara
                    for (let day = 1; day <= daysInJanuary; day++) {
                        const dateStr = `${year}-01-${day.toString().padStart(2, '0')}`;
                        if (!newNeradni.includes(dateStr)) {
                            newNeradni.push(dateStr);
                        }
                    }
                    setNeradniDani(newNeradni);
                    showToast(`❄️ Zimski raspust (januar ${year}) označen kao neradni! (${daysInJanuary} dana)`, 'info');
                };

                const resetNeradniDani = () => {
                    showConfirm('Resetovati sve neradne dane?', () => {
                        const oldDani = [...neradniDani];
                        setNeradniDani([]);
                        localStorage.removeItem('neradniDani');
                        showToast('✅ Neradni dani resetovani!');
                        closeModal();
                        pushUndo('Neradni dani resetovani', () => setNeradniDani(oldDani));
                    }, { detail: 'Ovo će obrisati sve označene praznike i raspuste.', type: 'danger' });
                };

                const resetRasporedPeriodi = () => {
                    showConfirm('Resetovati sve periode rasporeda?', () => {
                        const oldP = [...rasporedPeriodi];
                        setRasporedPeriodi([]);
                        localStorage.removeItem('rasporedPeriodi');
                        showToast('✅ Periodi resetovani!');
                        closeModal();
                        pushUndo('Periodi resetovani', () => setRasporedPeriodi(oldP));
                    }, { type: 'danger' });
                };

                const removePeriod = (index) => {
                    setRasporedPeriodi(prev => prev.filter((_, i) => i !== index));
                };

                const addManualPeriod = () => {
                    if (newPeriod.start && newPeriod.end) {
                        setRasporedPeriodi(prev => [...prev, newPeriod]);
                        setNewPeriod({ start: '', end: '', raspored: 'A' });
                        setShowAddPeriod(false);
                    }
                };

                return (
                    <div className="space-y-6 animate-fade-in">
                        <div className="bg-gradient-to-r from-green-50 via-emerald-50 to-teal-50 border-l-4 border-green-600 rounded-xl p-6 card-shadow-lg">
                            <h3 className="font-extrabold text-xl text-green-900 mb-4 flex items-center gap-2">
                                ⚡ Automatsko postavljanje
                            </h3>
                            <p className="text-green-800 mb-5 leading-relaxed">
                                Postavlja rasporede po mjesecima - <strong>svaki drugi mjesec isti raspored</strong>, 
                                počinje od septembra, <strong>preskače januar</strong> (zimski raspust).
                            </p>
                            <div className="flex flex-wrap gap-3 items-center">
                                <label className="text-sm font-bold text-green-900">Školska godina:</label>
                                <input
                                    type="number"
                                    value={skolskaGodina}
                                    onChange={(e) => setSkolskaGodina(e.target.value)}
                                    className="px-4 py-3 border-2 border-green-300 rounded-xl w-28 focus:ring-4 focus:ring-green-200 font-bold text-lg"
                                    placeholder="2025"
                                />
                                <button
                                    onClick={setupAutomaticPeriods}
                                    className="btn-success text-white px-6 py-3 rounded-xl font-bold card-shadow-lg"
                                >
                                    🚀 Automatski postavi
                                </button>
                                <button
                                    onClick={() => setActiveTab('podaci')}
                                    className="bg-red-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-red-700 card-shadow-lg flex items-center gap-2"
                                >
                                    🇧🇦 Uredi BiH praznike
                                </button>

            const SedmicniPlanGenerator = () => {
                // state je u parent NastavniPlanGenerator scopeu
                const isNeradni = createIsNeradni(neradniDani);

                const generatePlans = () => {
                    const plans = [];
                    let currentDate = parseLocalDate(startDate);
                    const end = parseLocalDate(endDate);
                    
                    // ✅ UVIJEK KREĆE OD 0 — ne čita classProgressIndex.
                    // Razlog: ako korisnik promijeni neradne dane i regeneriše,
                    // stari index bi preskočio jedinice kao da su održane.
                    //
                    // ✅ UVIJEK PER ODJELJENJE — čak i u grupeMode.
                    // Bug koji je bio: grupeMode koristio classProgress['7'] (per razred).
                    // Ako je 7a imalo čas u utorak (ponedjeljak neradni), classProgress['7']++
                    // je napredovao i za 7b koje je imalo samo ponedjeljak → 7b preskakalo jednu
                    // nastavnu jedinicu. Sada svako odjeljenje ima SVOj counter, ali dijeli
                    // ISTI POPIS JEDINICA po razredu (planKey koristi osnovniRazred).
                    const classProgress = {};
                    svaOdjeljenja.forEach(o => { classProgress[o] = 0; });
                    
                    // Sekcije: odvojeni progres po sekcijaNaziv::odjeljenje
                    const sectionProgress = {};

                    while (currentDate <= end) {
                        let activeRaspored = rasporedA; // Default
                        let foundPeriod = false;
                        for (const period of rasporedPeriodi) {
                            const pStart = parseLocalDate(period.start);
                            const pEnd = parseLocalDate(period.end);
                            if (currentDate >= pStart && currentDate <= pEnd) {
                                activeRaspored = period.raspored === 'A' ? rasporedA : rasporedB;
                                foundPeriod = true;
                                break;
                            }
                        }
                        if (!foundPeriod) {
                            console.warn(`Nema definisanog perioda za datum ${toLocalDateStr(currentDate)}. Koristi default A.`);
                        }

                        const monday = new Date(currentDate);
                        const dayOfWeek = (monday.getDay() + 6) % 7;
                        monday.setDate(monday.getDate() - dayOfWeek);

                        const weekKey = toLocalDateStr(monday);
                        if (!plans.find(p => p.weekStart === weekKey)) {
                            const weekPlan = {
                                weekStart: weekKey,
                                weekEnd: toLocalDateStr(new Date(monday.getTime() + 4 * 24 * 60 * 60 * 1000)),
                                schedule: {},
                                raspored: activeRaspored === rasporedA ? 'A' : 'B'
                            };

                            const dani = ['Ponedjeljak', 'Utorak', 'Srijeda', 'Četvrtak', 'Petak'];
                            
                            // weekUnitIndex: zamrzava koji index jedinice dobiva svako ODJELJENJE
                            // u ovoj sedmici. Čita se JEDNOM po odjeljenju (ne po razredu!).
                            // Ovo čuva blok-čas integritet:
                            //   7a period 1 i 7a period 2 istog dana → isti naslov jedinice ✓
                            // Ali 7a i 7b napreduju NEOVISNO (svako ima vlastiti progress) ✓
                            const weekUnitIndex = {};
                            
                            for (let dayOffset = 0; dayOffset < 5; dayOffset++) {
                                const currentDay = new Date(monday.getTime() + dayOffset * 24 * 60 * 60 * 1000);
                                
                                if (!isNeradni(currentDay)) {
                                    const danNaziv = dani[dayOffset];
                                    weekPlan.schedule[danNaziv] = {};

                                    const daySchedule = activeRaspored[danNaziv] || {};
                                    
                                    for (const [cas, slot] of Object.entries(daySchedule)) {
                                        // ── Aktivnost (čas 7): koristi sekcijePlanove, pozicija ovisi o smjeni ──
                                        if (slot.isSekcija && slot.sekcijaNaziv) {
                                            const sekKey = slot.sekcijaNaziv;
                                            if (sectionProgress[sekKey] === undefined) sectionProgress[sekKey] = 0;
                                            const sekUnits = sekcijePlanove[slot.sekcijaNaziv] || [];
                                            if (sectionProgress[sekKey] < sekUnits.length) {
                                                // Odredi smjenu: pogledaj ostale časove tog dana
                                                const otherSlots = Object.entries(daySchedule).filter(([c,s]) => !s.isSekcija);
                                                const daySmjena = otherSlots.length > 0 ? otherSlots[0][1].smjena : '1';
                                                // Smjena 1 → aktivnost na kraju (A9), Smjena 2 → aktivnost na početku (A0)
                                                const aktKey = daySmjena === '2' ? 'A0' : 'A9';
                                                weekPlan.schedule[danNaziv][aktKey] = {
                                                    ...slot,
                                                    unit: sekUnits[sectionProgress[sekKey]],
                                                    unitIndex: sectionProgress[sekKey],
                                                    isSekcija: true,
                                                    sekcijaNaziv: slot.sekcijaNaziv,
                                                    vrijeme: rasporedZvonjenja.sekcija.pocetak + '-' + rasporedZvonjenja.sekcija.kraj,
                                                    pozicija: aktKey
                                                };
                                                sectionProgress[sekKey]++;
                                            }
                                            continue;
                                        }
                                        
                                        const odjeljenje = slot.razred;
                                        const osnovniRazred = getOsnovniRazred(odjeljenje);
                                        const units = godisnjePlanove[planKey(osnovniRazred)] || [];
                                        
                                        if (grupeMode) {
                                            // GRUPNI MOD (blok-čas):
                                            // weekUnitIndex je PER ODJELJENJE (ne per razred).
                                            // Primera radi: 7a ima period 1 I period 2 istog dana →
                                            // oba dobivaju isti naslov jedinice (blok = 1 nastavna tema).
                                            // 7b ima własni weekUnitIndex, napreduje neovisno.
                                            // Ako je 7b-in dan bio neradni → progress['7b'] ostaje nepromijenjen
                                            // → naredne sedmice 7b počinje od tačno one jedinice gdje je stalo. ✓
                                            if (weekUnitIndex[odjeljenje] === undefined) {
                                                weekUnitIndex[odjeljenje] = classProgress[odjeljenje];
                                                if (classProgress[odjeljenje] < units.length) {
                                                    classProgress[odjeljenje]++;
                                                }
                                            }
                                            const unitIndex = weekUnitIndex[odjeljenje];
                                            if (unitIndex < units.length) {
                                                weekPlan.schedule[danNaziv][cas] = {
                                                    ...slot,
                                                    unit: units[unitIndex], unitIndex: unitIndex
                                                };
                                            }
                                        } else {
                                            // NORMALNI MOD: svaki čas dobiva svoju jedinicu po odjeljenju
                                            if (classProgress[odjeljenje] < units.length) {
                                                weekPlan.schedule[danNaziv][cas] = {
                                                    ...slot,
                                                    unit: units[classProgress[odjeljenje]], unitIndex: classProgress[odjeljenje]
                                                };
                                                classProgress[odjeljenje]++;
                                            }
                                        }
                                    }
                                }
                            }

                            plans.push(weekPlan);
                        }

                        currentDate.setDate(currentDate.getDate() + 7);
                    }

                    setGeneratedPlans(plans);
                    setClassProgressIndex(classProgress);
                    setSectionProgressIndex(sectionProgress);
                    // Zapamti verziju kalendara koji je korišten za generisanje
                    setPlansCalendarVersion(currentCalendarVersion);
                };

                const updateUnit = (weekIndex, dan, cas) => {
                    if (editText.trim()) {
                        setGeneratedPlans(prev => {
                            const newPlans = [...prev];
                            newPlans[weekIndex].schedule[dan][cas].unit = editText.trim();
                            return newPlans;
                        });
                        setEditingUnit(null);
                        setEditText('');
                    }
                };

                const removeLesson = (weekIndex, dan, cas) => {
                    const lessonData = generatedPlans[weekIndex].schedule[dan][cas];
                    if (confirm(`Da li želite ukloniti ovaj čas?\n\n${lessonData.razred.toUpperCase()}: ${lessonData.unit}\n\nSamo ovaj slot postaje prazan.\nOstali časovi u ovoj sedmici ostaju nepromijenjeni.\nJedinica se prenosi na prvu poziciju u narednoj sedmici.`)) {

                        setGeneratedPlans(prev => {
                            const newPlans = JSON.parse(JSON.stringify(prev));
                            const removedOdjeljenje = lessonData.razred;
                            const osnovniRazred = getOsnovniRazred(removedOdjeljenje);
                            const dani = ['Ponedjeljak', 'Utorak', 'Srijeda', 'Četvrtak', 'Petak'];

                            // 1. Samo ukloni ovaj jedan slot — ništa u istoj sedmici se ne dira
                            delete newPlans[weekIndex].schedule[dan][cas];

                            // 2. Sakupi sve buduće slotove za ovo odjeljenje
                            //    SAMO od naredne sedmice (wi > weekIndex) — ista sedmica se nikad ne dira!
                            const futureSlots = [];
                            for (let wi = weekIndex + 1; wi < newPlans.length; wi++) {
                                for (let di = 0; di < dani.length; di++) {
                                    const d = dani[di];
                                    if (!newPlans[wi].schedule[d]) continue;
                                    const entries = Object.entries(newPlans[wi].schedule[d])
                                        .sort(([a], [b]) => parseInt(a) - parseInt(b));
                                    for (const [c, data] of entries) {
                                        const match = grupeMode
                                            ? getOsnovniRazred(data.razred) === osnovniRazred
                                            : data.razred === removedOdjeljenje;
                                        if (match) futureSlots.push({ wi, d, c });
                                    }
                                }
                            }

                            // 3. Domino: umetni izbrisanu jedinicu na početak narednih slotova
                            //    Svaki slot dobija jedinicu prethodnog, posljednji slot ispada
                            let carryUnit = lessonData.unit;
                            for (const slot of futureSlots) {
                                const oldUnit = newPlans[slot.wi].schedule[slot.d][slot.c].unit;
                                newPlans[slot.wi].schedule[slot.d][slot.c].unit = carryUnit;
                                carryUnit = oldUnit;
                            }

                            return newPlans;
                        });

                        // Smanji progress za 1
                        // classProgress je uvijek per-odjeljenje (čak i u grupeMode)
                        const progressKey = lessonData.razred;
                        setClassProgressIndex(prev => ({
                            ...prev,
                            [progressKey]: Math.max(0, (prev[progressKey] || 0) - 1)
                        }));

                        showToast('✅ Čas uklonjen. Slot je prazan, ostali časovi nepromijenjeni. Jedinica prenesena u narednu sedmicu.');
                    }
                };

                const resetProgress = () => {
                    showConfirm('Resetovati praćenje progresa?', () => {
                        setClassProgressIndex({});
                        setGeneratedPlans([]);
                        setPlansCalendarVersion(0);
                        localStorage.removeItem('classProgressIndex');
                        showToast('✅ Progress resetovan! Sada kliknite Generiši planove.');
                        closeModal();
                    }, { detail: 'Ovo će obrisati generisane planove i početi ispočetka.', type: 'danger' });
                };

                const formatDate = (dateStr) => {
                    const date = parseLocalDate(dateStr);
                    const day = date.getDate().toString().padStart(2, '0');
                    const month = (date.getMonth() + 1).toString().padStart(2, '0');
                    const year = date.getFullYear();
                    return `${day}.${month}.${year}`;
                };

                const exportToWord = () => {
                    // Generiši Word-kompatibilan HTML dokument
                    let wordHTML = `
